        <div style="margin-top:12px">${u ? `<span class="chip g">${icon('check', 'sm')}${esc(t('ach.unlockedOn', { d: F.date(D.isoLocal(u.at).date, 'med') }))}</span>` : `<div class="row"><div class="grow">${bar(v / n, 'thin')}</div><span class="xs num">${F.num(Math.min(v, n))}/${F.num(n)}</span></div>`}</div></article>`; }).join('')}</div>
      <section class="card"><div class="card-h">${icon('list')}<h2>${esc(t('ach.log'))}</h2></div>${log.length ? `<div class="list">${log.map(p => `<div class="item"><span class="grow small">${esc(t(p.reason || 'pts.other'))}</span>${p.capped ? `<span class="chip">${esc(t('ach.capped'))}</span>` : ''}<span class="xs muted">${esc(F.date(p.date, 'short'))}</span><b class="num small">+${F.num(p.pts)}</b></div>`).join('')}</div>` : `<p class="small muted">${esc(t('ach.logEmpty'))}</p>`}</section>`;

};

<script>
'use strict';
/* =====================================================================
   VIEWS (C2): COACH · WEEKLY RESET · TEMPLATES · SETTINGS · ONBOARDING
               SMART SEARCH · COMMAND PALETTE · SNAPSHOT · DEMO · SHELL
   ===================================================================== */

/* ---------- ORION INTELLIGENCE (rules-based coach, explainable) ---------- */
const Coach = {
  insights() {
    const out = []; const td = today(); const add = (prio, ic, key, vars, why, act) => out.push({ prio, ic, title: t('coach.' + key, vars), why, act });
    const cap = Plan.capacity(td, D.nowMin());
    if (cap.over > 15) add(90, 'alert', 'overload', { m: F.dur(cap.over) }, t('coach.why.overload', { a: F.dur(cap.est), b: F.dur(cap.avail) }), `<button class="btn sm primary" data-act="setParam" data-k="tab" data-v="replan">${esc(t('coach.replan'))}</button>`);
    const od = Tasks.live().filter(Tasks.overdue); if (od.length) add(85, 'clock', 'overdue', { n: od.length }, t('coach.why.overdue', { t: od.slice(0, 3).map(x => x.title).join('، ') }), `<button class="btn sm primary" data-act="setParam" data-k="tab" data-v="replan">${esc(t('coach.replan'))}</button>`);
    const miss = Habits.list().map(h => ({ h, d: Habits.missed(h) })).filter(x => x.d); if (miss.length) add(70, 'leaf', 'recovery', { name: miss[0].h.name }, t('coach.why.recovery'), `<button class="btn sm" data-act="go" data-to="habits">${esc(t('coach.open'))}</button>`);
    Projects.list().filter(Projects.stale).slice(0, 2).forEach(p => add(60, 'folder', 'stale', { name: p.name, n: Projects.idleDays(p) }, t('coach.why.stale', { n: p.staleDays }), `<button class="btn sm" data-act="openProject" data-id="${p.id}">${esc(t('coach.open'))}</button>`));
    const f7 = D.range(D.add(td, -7), 7).map(d => Focus.minutesOn(d)); const fAvg = avg(f7); const ss = Focus.sessions();
    if (ss.length >= 3 && S.prefs.focusTarget > 0 && fAvg < S.prefs.focusTarget * .5) add(55, 'target', 'focusLow', { a: F.dur(fAvg), b: F.dur(S.prefs.focusTarget) }, t('coach.why.focusLow'), `<button class="btn sm" data-act="go" data-to="focus">${esc(t('focus.startBtn'))}</button>`);
    if (ss.length >= 5) { const byH = Array(24).fill(0); ss.forEach(s => byH[s.hour ?? 0] += s.minutes); const h = byH.indexOf(Math.max(...byH)); add(40, 'zap', 'peak', { h: F.minTime(h * 60) }, t('coach.why.peak', { n: ss.length }), `<button class="btn sm" data-act="newEvent" data-type="block">${esc(t('coach.block'))}</button>`); }
    const el = DB.all('energy_logs'); if (el.length >= 5) { const b = sortBy(BANDS.map(([a, z]) => { const v = el.filter(e => e.hour >= a && e.hour < z); return { a, z, v: v.length >= 2 ? avg(v.map(e => e.level)) : null }; }).filter(x => x.v != null), (x, y) => y.v - x.v)[0]; if (b) add(38, 'battery', 'energy', { a: b.a, b: b.z }, t('coach.why.energy', { n: el.length }), `<a class="btn sm" href="#/analytics?tab=energy">${esc(t('coach.open'))}</a>`); }
    const dl = DB.filter('distraction_logs', x => x.date >= D.add(td, -13)); const g = sortBy([...groupBy(dl, x => x.cause)], (a, b) => b[1].length - a[1].length)[0]; if (g && g[1].length >= 3) add(45, 'phone', 'dist', { c: t('dist.' + g[0]), n: g[1].length }, t('dist.tip.' + g[0]), `<a class="btn sm" href="#/analytics?tab=distractions">${esc(t('coach.open'))}</a>`);
    const br = sortBy(DB.all('balance_ratings'), (a, b) => b.id.localeCompare(a.id))[0]; if (br) { const low = Object.entries(br.ratings || {}).sort((a, b) => a[1] - b[1])[0]; if (low && low[1] <= 4) add(42, 'compass', 'balance', { a: Areas.label(low[0]), v: low[1] }, t('coach.why.balance'), `<button class="btn sm" data-act="balSmallStep" data-area="${low[0]}">${esc(t('bal.smallStep'))}</button>`); }
    if (NS.goal()) { const al = NS.alignment(7); if (al.total >= 3 && al.linked / al.total < .3) add(65, 'northstar', 'ns', { p: F.pct(al.linked / al.total) }, t('coach.why.ns'), `<a class="btn sm" href="#/goals?tab=northstar">${esc(t('coach.open'))}</a>`); }
    const dd = DB.filter('decisions', d => d.reviewDate && d.reviewDate <= td && !d.reviewed); if (dd.length) add(50, 'branch', 'decision', { n: dd.length }, t('coach.why.decision'), `<a class="btn sm" href="#/journal?tab=decisions">${esc(t('coach.open'))}</a>`);
    const ws = D.weekStart(td); const lastDay = D.add(ws, 6); if (!DB.get('weekly_resets', ws)?.completedAt && (td === lastDay || td === ws || D.diff(ws, td) >= 5)) add(58, 'rotate', 'reset', {}, t('coach.why.reset'), `<button class="btn sm primary" data-act="go" data-to="reset">${esc(t('coach.startReset'))}</button>`);
    const est = Tasks.all().filter(x => x.status === 'done' && +x.estimate > 0 && +x.actual > 0).slice(-20); if (est.length >= 5) { const r = sum(est.map(x => +x.actual)) / sum(est.map(x => +x.estimate)); if (r > 1.2) add(36, 'clock', 'estimate', { p: F.pct(r - 1) }, t('coach.why.estimate', { n: est.length }), ''); }
    const p1 = Tasks.live().filter(x => x.priority === 'p1' && isOpenStatus(x.status)).length; if (p1 > 5) add(48, 'flag', 'tooManyP1', { n: p1 }, t('coach.why.p1'), `<a class="btn sm" href="#/tasks?view=eisenhower">Eisenhower</a>`);
    if (!Plan.get(td).planned && D.nowMin() < 13 * 60 && Tasks.live().some(x => isOpenStatus(x.status))) add(52, 'sun', 'plan', {}, t('coach.why.plan'), `<button class="btn sm" data-act="go" data-to="myday">${esc(t('nav.myday'))}</button>`);
    return out.sort((a, b) => b.prio - a.prio);
  },
  /** Smart Replan: earliest non-rest day (next 14) with free capacity; priority & due order */
  replan() {
    const td = today(); const od = Tasks.live().filter(Tasks.overdue); const capT = Plan.capacity(td, D.nowMin());
    const over = capT.over > 0 ? capT.reschedule.filter(x => !od.includes(x)) : [];
    const cands = sortBy([...od.map(x => ({ x, why: 'overdue' })), ...over.map(x => ({ x, why: 'overload' }))], (a, b) => PRIO_W[b.x.priority] - PRIO_W[a.x.priority], (a, b) => (a.x.due || '').localeCompare(b.x.due || ''));
    const rem = {}; const remOf = d => { if (rem[d] == null) { const c = d === td ? Plan.capacity(d, D.nowMin()) : Plan.capacity(d); rem[d] = Cal.isRest(d) ? -1 : c.avail - c.est; } return rem[d]; };
    return cands.map(({ x, why }) => { const du = Tasks.dur(x) || 30; let target = null; for (let i = why === 'overload' ? 1 : 0; i < 14; i++) { const d = D.add(td, i); if (remOf(d) >= du) { target = d; rem[d] -= du; break; } } return { x, why, to: target || D.add(td, 1), fits: !!target }; });
  }
};
Views.coach = {
  render(p) {
    const tab = p.tab === 'replan' ? 'replan' : 'insights';
    const head = viewHead('ORION INTELLIGENCE', t('nav.coach'), t('coach.sub'));
    const ai = `<div class="note" style="margin-bottom:18px">${icon('shield')}<span><b>${esc(t('coach.aiTitle'))}</b> — ${esc(t('coach.aiText'))}</span></div>`;
    const tabs = `<div class="tabs" role="tablist" style="margin-bottom:18px"><button role="tab" aria-selected="${tab === 'insights'}" data-act="setParam" data-k="tab" data-v="insights">${esc(t('coach.tab.insights'))}</button><button role="tab" aria-selected="${tab === 'replan'}" data-act="setParam" data-k="tab" data-v="replan">Smart Replan</button></div>`;
    if (!S.prefs.smartEnabled) return head + ai + `<section class="card">${emptyState({ title: t('coach.off'), text: t('coach.offText'), action: `<button class="btn primary" data-act="smartOn">${esc(t('coach.turnOn'))}</button>` })}</section>`;
    if (tab === 'replan') return head + ai + tabs + this.replan();
    const ins = Coach.insights(); const nba = NBA.rank(3);
    return head + ai + tabs + `<div class="grid g2"><section class="card"><div class="card-h">${icon('sparkles')}<h2>${esc(t('coach.insights'))}<div class="card-sub">${esc(t('coach.insightsSub'))}</div></h2></div>
      ${ins.length ? `<div class="col" style="gap:12px">${ins.map(i => `<article class="item" style="align-items:flex-start"><span class="k-ic v" style="width:36px;height:36px;flex:none">${icon(i.ic, 'sm')}</span><div class="grow"><b class="small ucontent">${esc(i.title)}</b><div class="xs muted" style="margin-top:4px"><span class="lbl" style="font-size:.66rem">${esc(t('coach.why'))}</span> ${esc(i.why)}</div>${i.act ? `<div class="row wrap" style="margin-top:8px">${i.act}</div>` : ''}</div></article>`).join('')}</div>` : emptyState({ title: t('coach.allClear'), text: t('coach.allClearText'), small: true })}</section>
      <section class="card"><div class="card-h">${icon('zap')}<h2>Next Best Action<div class="card-sub">${esc(t('nba.sub'))}</div></h2></div>${nba.length ? nba.map((r, i) => `<div class="nba" style="margin-bottom:10px"><div class="row"><span class="rank">${F.num(i + 1)}</span><b class="grow ucontent">${esc(r.task.title)}</b><button class="btn sm primary" data-act="focusTask" data-id="${r.task.id}">${icon('play', 'sm')}</button></div><ul class="reason-list" style="margin-top:6px">${r.reasons.map(x => `<li>${icon('check', 'sm')}<span>${esc(NBA.reasonText(x))}</span></li>`).join('')}</ul></div>`).join('') : `<p class="small muted">${esc(t('nba.none'))}</p>`}</section></div>`;
  },
  replan() {
    const rows = Coach.replan();
    if (!rows.length) return `<section class="card">${emptyState({ title: t('rp.none'), text: t('rp.noneText'), small: true })}</section>`;
    return `<section class="card"><div class="card-h">${icon('rotate')}<h2>Smart Replan<div class="card-sub">${esc(t('rp.sub'))}</div></h2></div>
      <form data-form="replanApply" class="col"><div class="scroll-x"><table class="table"><thead><tr><th><span class="sr-only">${esc(t('c.select'))}</span></th><th>${esc(t('task.f.title'))}</th><th>${esc(t('rp.reason'))}</th><th>${esc(t('rp.from'))}</th><th>${esc(t('rp.to'))}</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><input type="checkbox" name="sel" value="${r.x.id}" checked aria-label="${esc(r.x.title)}"></td><td><span class="ucontent">${esc(r.x.title)}</span> ${prioChip(r.x.priority)}<div class="xs muted">${esc(Tasks.dur(r.x) ? F.dur(Tasks.dur(r.x)) : t('rp.noEst'))}</div></td><td><span class="chip ${r.why === 'overdue' ? 'r' : 'w'}">${esc(t('rp.why.' + r.why))}</span></td><td class="small">${esc(r.x.due ? F.date(r.x.due, 'short') : '—')}</td><td><input class="input" type="date" name="to_${r.x.id}" value="${r.to}" style="min-height:34px;padding:4px 8px;width:auto">${r.fits ? '' : `<div class="xs" style="color:var(--warn)">${esc(t('rp.noFit'))}</div>`}</td></tr>`).join('')}</tbody></table></div>
      <div class="row wrap"><button class="btn primary" type="submit">${icon('check', 'sm')}${esc(t('rp.apply'))}</button><span class="xs muted">${esc(t('rp.note'))}</span></div></form></section>`;
  }
};
FORMS.replanApply = async data => { const ids = data.getAll('sel'); let n = 0; for (const id of ids) { const to = data.get('to_' + id); if (!D.valid(to)) continue; const x = Tasks.get(id); await Tasks.update(id, { due: to, status: x.status === 'postponed' ? 'todo' : x.status }); n++; } toast(t('rp.done', { n }), 'ok'); };
A.smartOn = () => setPrefs({ smartEnabled: true });

/* ---------- WEEKLY RESET (record id = weekStart) ---------- */
const RESET_STEPS = ['review', 'clean', 'goals', 'plan', 'habits', 'finish'];
Views.reset = {
  render(p) {
    const ws = D.weekStart(today()); const rec = DB.get('weekly_resets', ws) || { id: ws, step: 0 };
    const step = clamp(p.step != null ? +p.step : (rec.completedAt ? 5 : +rec.step || 0), 0, 5);
    const head = viewHead('WEEKLY RESET', t('nav.reset'), t('reset.sub', { d: F.date(ws, 'med') }));
    const stepper = `<ol class="stepper" aria-label="${esc(t('reset.steps'))}">${RESET_STEPS.map((s, i) => `<li class="${i < step || rec.completedAt ? 'done' : ''} ${i === step ? 'cur' : ''}"><button data-act="setParam" data-k="step" data-v="${i}" aria-current="${i === step ? 'step' : 'false'}"><span class="step-n">${F.num(i + 1)}</span><span class="lbl-txt">${esc(t('reset.s.' + s))}</span></button></li>`).join('')}</ol>`;
    const nav = (extra = '') => `<div class="row wrap" style="margin-top:18px">${step > 0 ? `<button class="btn" type="button" data-act="setParam" data-k="step" data-v="${step - 1}">${icon('chev-l', 'sm flip')}${esc(t('c.back'))}</button>` : ''}<span class="grow"></span>${extra}${step < 5 ? `<button class="btn primary" type="submit">${esc(t('c.next'))}${icon('chev-r', 'sm flip')}</button>` : ''}</div>`;
    const pws = D.add(ws, -7), pwe = D.add(ws, -1); let body = '';
    if (step === 0) {
      const m = An.metrics(pws, pwe);
      body = `<p class="small muted">${esc(t('reset.reviewText', { a: F.date(pws, 'med'), b: F.date(pwe, 'med') }))}</p><div class="grid g3" style="margin:14px 0">${[['check', F.num(m.done), t('an.tasksDone')], ['target', F.dur(m.focus), t('an.focusTime')], ['repeat', m.habits == null ? '—' : F.pct(m.habits), t('an.habitCons')], ['sparkles', m.score == null ? '—' : F.num(m.score), t('an.avgScoreShort')], ['journal', F.num(m.journal), t('an.journal')], ['flag', F.num(Goals.list().filter(g => g.achievedAt && D.isoLocal(g.achievedAt).date >= pws && D.isoLocal(g.achievedAt).date <= pwe).length), t('reset.goalsAch')]].map(([ic, v, l]) => `<div class="kpi"><div class="k-ic v">${icon(ic)}</div><div class="stat"><b class="num">${esc(v)}</b><span>${esc(l)}</span></div></div>`).join('')}</div>
        <label class="field"><span>${esc(t('reset.wins'))}</span><textarea class="textarea" name="wins" rows="3" dir="auto">${esc(rec.wins || '')}</textarea></label><label class="field"><span>${esc(t('reset.lessons'))}</span><textarea class="textarea" name="lessons" rows="3" dir="auto">${esc(rec.lessons || '')}</textarea></label><label class="field"><span>${esc(t('reset.drain'))}</span><textarea class="textarea" name="drain" rows="2" dir="auto">${esc(rec.drain || '')}</textarea></label>`;
    } else if (step === 1) {
      const od = Tasks.smartSort(Tasks.live().filter(x => Tasks.overdue(x) || x.status === 'postponed'));
      const nodate = Tasks.live().filter(x => !x.due && isOpenStatus(x.status)).length;
      body = `<p class="small muted">${esc(t('reset.cleanText'))}</p>${od.length ? `<div class="list" style="margin-top:12px">${od.map(x => `<div class="item"><div class="grow"><div class="item-title ucontent">${esc(x.title)}</div><div class="item-meta">${prioChip(x.priority)} ${x.due ? esc(F.date(x.due, 'short')) : ''} ${statusChip(x.status)}</div></div><div class="row wrap" style="gap:4px"><button class="btn sm" type="button" data-act="resetMove" data-id="${x.id}" data-to="${today()}">${esc(t('reset.toToday'))}</button><button class="btn sm" type="button" data-act="resetMove" data-id="${x.id}" data-to="${D.add(today(), 2)}">${esc(t('reset.later'))}</button><button class="btn sm ghost" type="button" data-act="resetMove" data-id="${x.id}" data-to="">${esc(t('reset.noDate'))}</button><button class="btn sm ghost icon" type="button" data-act="toggleTask" data-id="${x.id}" aria-label="${esc(t('c.done'))}">${icon('check', 'sm')}</button><button class="btn sm ghost icon" type="button" data-act="trashTask" data-id="${x.id}" aria-label="${esc(t('c.delete'))}">${icon('trash', 'sm')}</button></div></div>`).join('')}</div>` : `<div class="note ok" style="margin-top:12px">${icon('check')}<span>${esc(t('reset.cleanOk'))}</span></div>`}<p class="xs muted" style="margin-top:10px">${esc(t('reset.noDateN', { n: nodate }))} · <a href="#/tasks">${esc(t('nav.tasks'))}</a></p>`;
    } else if (step === 2) {
      const gs = Goals.active(); const stale = Projects.list().filter(Projects.stale);
      body = `<p class="small muted">${esc(t('reset.goalsText'))}</p>${gs.length ? `<div class="list" style="margin-top:12px">${gs.map(g => `<div class="item"><span class="chip v lvl-chip">${esc(t('glvl.' + g.level))}</span><div class="grow"><div class="item-title ucontent">${esc(g.title)}</div><div class="item-meta">${esc(Goals.nextStep(g) ? t('goal.next') + ': ' + Goals.nextStep(g) : t('reset.noNext'))}</div></div><b class="num small">${F.pct(Goals.progress(g))}</b><button class="btn sm" type="button" data-act="openGoal" data-id="${g.id}">${esc(t('coach.open'))}</button></div>`).join('')}</div>` : emptyState({ title: t('goal.empty'), action: `<button class="btn" type="button" data-act="newGoal">${esc(t('goal.new'))}</button>`, small: true })}
        ${stale.length ? `<div class="note warn" style="margin-top:12px">${icon('alert')}<span>${esc(t('proj.staleNote', { names: stale.map(x => x.name).join('، ') }))}</span></div>` : ''}<label class="field" style="margin-top:14px"><span>${esc(t('reset.weekFocus'))}</span><input class="input" name="focus" value="${esc(rec.focus || '')}" maxlength="200" dir="auto" placeholder="${esc(t('reset.weekFocusPh'))}"></label>`;
    } else if (step === 3) {
      const open = Tasks.smartSort(Tasks.live().filter(x => isOpenStatus(x.status))).slice(0, 40); const pri = new Set(rec.priorities || []);
      body = `<p class="small muted">${esc(t('reset.planText'))}</p>${open.length ? `<fieldset style="border:0;padding:0;margin:12px 0 0"><legend class="sr-only">${esc(t('reset.priorities'))}</legend><div class="list">${open.map(x => `<label class="item" style="cursor:pointer"><input type="checkbox" name="pri" value="${x.id}"${chk(pri.has(x.id))} data-change="resetPriLimit"><span class="grow ucontent">${esc(x.title)}</span>${prioChip(x.priority)}${x.due ? `<span class="xs muted">${esc(F.date(x.due, 'short'))}</span>` : ''}</label>`).join('')}</div></fieldset>` : ''}
        <div class="row" style="margin-top:12px"><input class="input" id="resetQuick" placeholder="${esc(t('reset.addTask'))}" maxlength="200" dir="auto"><button class="btn" type="button" data-act="resetAddTask">${icon('plus', 'sm')}${esc(t('c.add'))}</button></div><p class="xs muted" style="margin-top:8px">${esc(t('reset.planNote'))}</p>`;
    } else if (step === 4) {

FORMS.resetStep = async (data, form) => {
  const ws = D.weekStart(today()); const step = +form.dataset.step; const rec = DB.get('weekly_resets', ws) || { id: ws };
  const patch = {}; ['wins', 'lessons', 'drain', 'focus', 'intention'].forEach(k => { if (data.has(k)) patch[k] = String(data.get(k)).trim().slice(0, 2000); });
  if (step === 3) patch.priorities = data.getAll('pri').slice(0, 5);
  await DB.put('weekly_resets', { ...rec, ...patch, step: Math.max(+rec.step || 0, step + 1) });
  if (step === 3 && patch.priorities.length) { const ld = D.add(ws, 6); for (const id of patch.priorities) { const x = Tasks.get(id); if (x && (!x.due || x.due > ld)) await Tasks.update(id, { due: ld }); } }
  setParam('step', step + 1);
};

const TPL_KINDS = ['checklist', 'blocks', 'journal', 'project', 'skill'];
const TplApply = {
  async run(tpl, date, opts = {}) {
    if (tpl.kind === 'checklist') { for (const title of tpl.items) await Tasks.create({ title: String(title).slice(0, 200), due: date, priority: 'p3', tags: ['template'] }); toast(t('tpl.appliedTasks', { n: tpl.items.length }), 'ok'); go('myday', { d: date }); }
    else if (tpl.kind === 'blocks') {
      const existing = Cal.on(date).filter(o => o.ev.type === 'block').length;
      if (existing && !(await confirmDlg(t('tpl.blocksExist', { n: existing }), { ok: t('tpl.applyAnyway') }))) return;
      await DB.putMany('calendar_events', tpl.items.map(b => ({ id: uid(), title: String(b.title).slice(0, 200), type: 'block', date, allDay: false, start: b.s, end: b.e, recur: 'none', interval: 1, until: '', notes: '' })));
      await Plan.save(date, { blocks: true }); toast(t('tpl.appliedBlocks', { n: tpl.items.length }), 'ok'); go('myday', { d: date });
    } else if (tpl.kind === 'journal') { JournalEditor.open(null, { type: 'custom', date, questions: tpl.items, title: tpl.name }); }
    else if (tpl.kind === 'project') {
      const p = await DB.put('projects', { id: uid(), name: (opts.name || tpl.name).slice(0, 150), desc: tpl.desc || '', status: 'planning', start: date, end: '', goalId: '', areaId: '', staleDays: 7, milestones: [], links: [], changelog: [], blockers: [], lastActivity: nowISO() });
      for (const title of tpl.items) await Tasks.create({ title: String(title).slice(0, 200), projectId: p.id, priority: 'p3' });
      await Projects.log(p.id, 'log.fromTpl', { t: tpl.name }); toast(t('proj.created'), 'ok'); go('projects', { id: p.id });
    } else if (tpl.kind === 'skill') {
      const root = await DB.put('learning_items', { id: uid(), title: (opts.name || tpl.name).slice(0, 200), kind: 'skill', status: 'active', level: 0, parentId: '', done: 0, total: '', areaId: 'learning' });
      await DB.putMany('learning_items', tpl.items.map(title => ({ id: uid(), title: String(title).slice(0, 200), kind: 'skill', status: 'planned', level: 0, parentId: root.id, done: 0, total: '', areaId: 'learning' })));
      toast(t('tpl.appliedSkill'), 'ok'); go('learning', { tab: 'tree' });
    }
    Audit.log('template_apply', tpl.id);
  }
};

FORMS.tplSave = async (data, form) => {
  const o = fd(data); if (!o.name) return fieldErr(form, 'name', t('val.required'));
  const raw = String(data.get('items') || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 40);
  if (!raw.length) return fieldErr(form, 'items', t('val.required'));
  let items = raw;
  if (o.kind === 'blocks') { items = []; for (const line of raw) { const m = line.match(/^(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})\s+(.+)$/); if (!m || D.toMin(m[2]) <= D.toMin(m[1])) return fieldErr(form, 'items', t('tpl.val.blocks', { l: line.slice(0, 40) })); items.push({ s: m[1].padStart(5, '0'), e: m[2].padStart(5, '0'), title: m[3].slice(0, 120) }); } }
  const id = form.dataset.id || 'tpc_' + uid(); const base = BUILTIN_TPL.find(b => b.id === id);
  await DB.put('templates', { ...(DB.get('templates', id) || {}), id, kind: o.kind, icon: base?.icon || 'layout', name: o.name.slice(0, 120), desc: o.desc || '', items });
  Modal.close(); toast(t('c.saved'), 'ok');
};

/* ---------- Backup: export / import / CSV / delete all ---------- */
const Backup = {
  dump() { const stores = {}; STORES.forEach(s => stores[s] = DB.all(s)); return { app: 'ORION', format: 1, exportedAt: nowISO(), stores }; },
  validate(obj) {
    if (!obj || typeof obj !== 'object' || obj.app !== 'ORION' || typeof obj.stores !== 'object') return t('imp.invalid');
    for (const [k, v] of Object.entries(obj.stores)) { if (!STORES.includes(k)) continue; if (!Array.isArray(v)) return t('imp.badStore', { s: k }); if (v.some(r => !r || typeof r !== 'object' || typeof r.id !== 'string' || !r.id)) return t('imp.badRecord', { s: k }); }
    return null;
  }
};
A.exportAll = () => { downloadFile(`orion-backup-${today()}.json`, JSON.stringify(Backup.dump(), null, 1)); Audit.log('export', 'json'); setPrefs({ lastBackup: nowISO() }, { quiet: true }).catch(() => { }); toast(t('c.exported'), 'ok'); };
A.exportCSV = () => {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['title', 'status', 'priority', 'due', 'start', 'end', 'project', 'goal', 'area', 'tags', 'estimate_min', 'actual_min', 'completedAt']].concat(Tasks.all().filter(x => !x.deletedAt).map(x => [x.title, x.status, x.priority, x.due, x.start, x.end, DB.get('projects', x.projectId)?.name, DB.get('goals', x.goalId)?.title, Areas.label(x.areaId), (x.tags || []).join('|'), x.estimate, x.actual, x.completedAt]));
  downloadFile(`orion-tasks-${today()}.csv`, '\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv'); Audit.log('export', 'csv'); toast(t('c.exported'), 'ok');
};
CH.importFile = async el => {
  const f = el.files?.[0]; el.value = ''; if (!f) return;
  if (f.size > 60 * 1024 * 1024) { toast(t('imp.tooBig'), 'err'); return; }
  let obj; try { obj = JSON.parse(await f.text()); } catch { toast(t('imp.parse'), 'err'); return; }
  const err = Backup.validate(obj); if (err) { toast(err, 'err'); return; }
  const counts = Object.entries(obj.stores).filter(([k, v]) => STORES.includes(k) && v.length).map(([k, v]) => `${k}: ${v.length}`);
  const root = Modal.open({ title: esc(t('imp.title')), body: `<p class="small">${esc(t('imp.found', { d: obj.exportedAt ? F.dt(obj.exportedAt) : '—' }))}</p><ul class="small t2" style="max-height:180px;overflow:auto">${counts.map(c => `<li>${esc(c)}</li>`).join('')}</ul><div class="note warn">${icon('alert')}<span>${esc(t('imp.warn'))}</span></div>`, foot: `<button class="btn ghost" data-modal-close>${esc(t('c.cancel'))}</button><button class="btn" data-imp="merge">${esc(t('imp.merge'))}</button><button class="btn danger" data-imp="replace">${esc(t('imp.replace'))}</button>` });
  root.querySelectorAll('[data-imp]').forEach(b => b.onclick = async () => {
    const mode = b.dataset.imp; b.disabled = true;
    try {
      for (const s of STORES) { const recs = obj.stores[s]; if (mode === 'replace') await DB.clearStore(s); if (Array.isArray(recs) && recs.length) await DB.putMany(s, recs, { keepStamp: true, quiet: true }); }
      Audit.log('import', mode); Modal.close(true); loadPrefs(); applyAppearance(); Timer.load(); App.mountShell(); toast(t('imp.done'), 'ok');
    } catch (e) { console.error(e); toast(t('imp.failed'), 'err'); b.disabled = false; }
  });
};

/* ---------- ORION SNAPSHOT (shareable summary image, generated locally) ---------- */
const Snapshot = {
  svg(period, priv) {
    const n = period === 'month' ? 30 : 7; const R = An.range(n); const m = An.metrics(R.a, R.b); const L = Points.level();
    const ns = NS.goal(); const rtl = isRTL(); const W = 1080, H = 1080; const x0 = rtl ? W - 90 : 90; const anc = rtl ? 'end' : 'start';
    const stat = (i, v, l) => { const col = i % 2, row = Math.floor(i / 2); const cx = rtl ? W - 90 - col * 460 : 90 + col * 460; const cy = 470 + row * 150; return `<rect x="${rtl ? cx - 420 : cx}" y="${cy - 70}" width="420" height="124" rx="26" fill="#111A35" stroke="rgba(139,92,246,.35)"/><text x="${rtl ? cx - 28 : cx + 28}" y="${cy}" text-anchor="${anc}" font-size="52" font-weight="800" fill="#EEF2FF">${esc(v)}</text><text x="${rtl ? cx - 28 : cx + 28}" y="${cy + 36}" text-anchor="${anc}" font-size="24" fill="#94A3C8">${esc(l)}</text>`; };
    const stats = [[F.num(m.done), t('an.tasksDone')], [F.dur(m.focus), t('an.focusTime')], [m.habits == null ? '—' : F.pct(m.habits), t('an.habitCons')], [m.score == null ? '—' : F.num(m.score), t('an.avgScoreShort')]];
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" direction="${rtl ? 'rtl' : 'ltr'}">
      <defs><linearGradient id="sb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset="1" stop-color="#080D1F"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#F472B6"/></linearGradient><radialGradient id="sc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C4B5FD"/><stop offset=".6" stop-color="#8B5CF6"/><stop offset="1" stop-color="#4C1D95"/></radialGradient><radialGradient id="sh" cx=".8" cy=".1" r=".7"><stop offset="0" stop-color="rgba(139,92,246,.28)"/><stop offset="1" stop-color="rgba(139,92,246,0)"/></radialGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#sb)"/><rect width="${W}" height="${H}" fill="url(#sh)"/>
      ${Array.from({ length: 40 }, (_, i) => `<circle cx="${(i * 197) % W}" cy="${(i * 131) % 380}" r="${i % 5 === 0 ? 2 : 1.2}" fill="#fff" opacity="${.15 + (i % 4) * .1}"/>`).join('')}
      <g transform="translate(${rtl ? 150 : W - 150} 170)"><ellipse rx="110" ry="40" fill="none" stroke="url(#sg)" stroke-width="3" transform="rotate(-25)"/><circle r="44" fill="url(#sc)"/><circle cx="96" cy="-42" r="8" fill="#F472B6"/></g>
      <text x="${x0}" y="150" text-anchor="${anc}" font-size="30" letter-spacing="8" fill="#A78BFA" font-weight="700">ORION SNAPSHOT</text>
      <text x="${x0}" y="225" text-anchor="${anc}" font-size="64" font-weight="800" fill="#EEF2FF">${esc(t(period === 'month' ? 'snap.month' : 'snap.week'))}</text>
      <text x="${x0}" y="275" text-anchor="${anc}" font-size="28" fill="#94A3C8">${esc(F.date(R.a, 'med'))} — ${esc(F.date(R.b, 'med'))}</text>
      ${!priv && S.profile?.name ? `<text x="${x0}" y="330" text-anchor="${anc}" font-size="30" fill="#C7D2FE">${esc(S.profile.name)}</text>` : ''}
      <rect x="90" y="360" width="${W - 180}" height="4" rx="2" fill="url(#sg)" opacity=".7"/>
      ${stats.map((s, i) => stat(i, s[0], s[1])).join('')}
      ${ns && !priv ? `<text x="${x0}" y="850" text-anchor="${anc}" font-size="24" fill="#A78BFA" letter-spacing="3">NORTH STAR</text><text x="${x0}" y="895" text-anchor="${anc}" font-size="34" font-weight="700" fill="#EEF2FF">${esc(ns.title.slice(0, 48))} · ${esc(F.pct(Goals.progress(ns)))}</text>` : `<text x="${x0}" y="880" text-anchor="${anc}" font-size="30" fill="#C7D2FE">${esc(t('snap.level', { n: L.lvl }))}</text>`}
      <text x="${x0}" y="1000" text-anchor="${anc}" font-size="22" fill="#64748B">${esc(t('app.tagline'))}</text></svg>`;
  }
};

<script>
'use strict';
/* =====================================================================
   BOOT — storage → preferences → appearance → shell → listeners
   ===================================================================== */
(async function boot() {
  try {
    await DB.init();
    loadPrefs(); applyAppearance();
    Timer.load();
    try { await Tasks.purgeOld(); } catch (e) { console.warn(e); }
    S.route = parseHash();
    App.mountShell();
  } catch (err) {
    console.error(err);
    $('#root').innerHTML = `<div class="onb"><div class="card onb-card"><div class="empty">${icon('alert', 'xl')}<h3>${esc(t('err.boot'))}</h3><p>${esc(String(err?.message || err))}</p><button class="btn primary" onclick="location.reload()">${esc(t('c.reload'))}</button></div></div></div>`;
  } finally {
    const sp = $('#splash'); if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 450); }
  }

  window.addEventListener('hashchange', () => { S.route = parseHash(); Dropdown.close(); NotifPanel.close(); if (S.prefs.onboarded) App.renderView(true); });
  const evalAch = debounce(() => Ach.evaluate().catch(e => console.warn(e)), 900);
  Bus.on('change', () => { App.schedule(); Modal.refresh(); evalAch(); });

  /* global keyboard: focus trap, Esc, Ctrl/⌘K palette, "/" search, "N" new task */
  document.addEventListener('keydown', e => {
    trapFocus(e);
    if (e.key === 'Escape') {
      if (Dropdown.el) { Dropdown.anchor?.focus?.(); Dropdown.close(); e.preventDefault(); return; }
      if (NotifPanel.el) { NotifPanel.close(); $('#notifBtn')?.focus(); e.preventDefault(); return; }
      if (Modal.top()) { Modal.close(); e.preventDefault(); return; }
      if (FocusMode.el) { FocusMode.close(); e.preventDefault(); return; }
      if ($('#sidebar.open')) { App.closeNav(); return; }
    }
    if (!S.prefs.onboarded) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); A.openPalette(); return; }
    const typing = e.target.closest('input,textarea,select,[contenteditable="true"]');
    if (typing || e.ctrlKey || e.metaKey || e.altKey || Modal.top() || FocusMode.el) return;
    if (e.key === '/') { e.preventDefault(); A.openSearch(); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); TaskForm.open(); }
  });

  Drag.init();
  setInterval(() => App.tickClock(), 15000);
  setInterval(() => { Reminders.check().catch(e => console.warn(e)); }, 30000);
  setTimeout(() => Reminders.check().catch(() => { }), 4000);
  // re-render at midnight so "today" stays correct
  let lastDay = today();
  setInterval(() => { const d = today(); if (d !== lastDay) { lastDay = d; F._c.clear(); App.schedule(); } }, 60000);
  // timers are timestamp-based; refresh immediately when the tab becomes visible again
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { Timer.tick(); App.tickClock(); } });
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', () => applyAppearance());
})();
</script>
