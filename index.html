<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="cosmos">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#080D1F">
<meta name="description" content="ORION — The Personal Excellence System. Master Your Day. Shape Your Future.">
<title>ORION — The Personal Excellence System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.45' stop-color='%23A78BFA'/%3E%3Cstop offset='1' stop-color='%238B5CF6' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230B1026'/%3E%3Cellipse cx='32' cy='32' rx='24' ry='10' fill='none' stroke='%2338BDF8' stroke-width='2' transform='rotate(-25 32 32)'/%3E%3Ccircle cx='32' cy='32' r='14' fill='url(%23g)'/%3E%3Ccircle cx='51' cy='22' r='3' fill='%23F472B6'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   ORION — DESIGN SYSTEM
   1. Tokens (Cosmos / Daylight / Focus)   2. Base & typography
   3. Shell (sidebar, topbar, bottom nav)  4. Components
   5. Views                                6. Overlays (modal, palette, focus mode)
   7. Motion & accessibility               8. Responsive
   ===================================================================== */

/* ---------- 1. TOKENS ---------- */
:root{
  --bg:#080D1F; --bg-2:#0B1026; --surface:#111A35; --surface-2:#16224A; --surface-3:#1C2A57;
  --glass:rgba(17,26,53,.72); --line:rgba(160,174,255,.12); --line-2:rgba(160,174,255,.22);
  --violet:#8B5CF6; --violet-2:#A78BFA; --blue:#38BDF8; --blue-2:#7DD3FC; --pink:#F472B6; --pink-2:#F9A8D4;
  --text:#E8EDFF; --text-2:#B7C1E3; --muted:#8C98BF;
  --success:#34D399; --success-bg:rgba(52,211,153,.12);
  --warn:#FBBF24; --warn-bg:rgba(251,191,36,.12);
  --danger:#FB7185; --danger-bg:rgba(251,113,133,.12);
  --info-bg:rgba(56,189,248,.12);
  --grad-brand:linear-gradient(135deg,#8B5CF6 0%,#38BDF8 55%,#F472B6 100%);
  --grad-soft:linear-gradient(135deg,rgba(139,92,246,.22),rgba(56,189,248,.12) 60%,rgba(244,114,182,.16));
  --grad-btn:linear-gradient(135deg,#8B5CF6,#6D5AF0 50%,#3B9BF0);
  --shadow-1:0 1px 2px rgba(0,0,0,.25),0 4px 16px rgba(3,6,20,.35);
  --shadow-2:0 10px 40px rgba(3,6,20,.55);
  --glow-v:0 0 0 1px rgba(139,92,246,.35),0 8px 30px rgba(139,92,246,.18);
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:28px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  --sidebar-w:264px; --topbar-h:64px;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans","Noto Sans Arabic","Geeza Pro","Tahoma",Arial,sans-serif;
  --font-num: ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.8,.26,1); --dur:.22s;
  color-scheme:dark;
}
[data-theme="daylight"]{
  --bg:#F3F5FC; --bg-2:#EAEEFA; --surface:#FFFFFF; --surface-2:#F4F6FD; --surface-3:#E9EDFA;
  --glass:rgba(255,255,255,.8); --line:rgba(40,52,110,.10); --line-2:rgba(40,52,110,.18);
  --violet:#7444E8; --violet-2:#8B5CF6; --blue:#0E8FCB; --blue-2:#38BDF8; --pink:#D9468F; --pink-2:#F472B6;
  --text:#121834; --text-2:#38426A; --muted:#5E6890;
  --success:#0F9F6E; --success-bg:rgba(15,159,110,.10); --warn:#B7791F; --warn-bg:rgba(183,121,31,.12);
  --danger:#D63B5C; --danger-bg:rgba(214,59,92,.10); --info-bg:rgba(14,143,203,.10);
  --grad-soft:linear-gradient(135deg,rgba(116,68,232,.12),rgba(14,143,203,.08) 60%,rgba(217,70,143,.10));
  --shadow-1:0 1px 2px rgba(20,30,80,.06),0 6px 20px rgba(20,30,80,.07);
  --shadow-2:0 16px 48px rgba(20,30,80,.16);
  --glow-v:0 0 0 1px rgba(116,68,232,.3),0 8px 24px rgba(116,68,232,.12);
  color-scheme:light;
}
/* Focus theme: calmer palette, decor hidden, secondary widgets hidden */
[data-theme="focus"]{
  --bg:#070B19; --bg-2:#090E20; --surface:#0F1630; --surface-2:#131C3B; --surface-3:#18234A;
  --grad-soft:linear-gradient(135deg,rgba(139,92,246,.10),rgba(56,189,248,.06));
}
[data-theme="focus"] .decor, [data-theme="focus"] [data-secondary], [data-theme="focus"] .starfield{display:none!important}

/* ---------- 2. BASE ---------- */
*,*::before,*::after{box-sizing:border-box}
html{font-size:15px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(139,92,246,.16),transparent 60%),
             radial-gradient(900px 500px at -10% 10%,rgba(56,189,248,.10),transparent 60%),
             radial-gradient(800px 600px at 60% 120%,rgba(244,114,182,.08),transparent 60%),var(--bg)}
[data-theme="daylight"] body::before{background:radial-gradient(1000px 500px at 85% -10%,rgba(116,68,232,.10),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(14,143,203,.07),transparent 60%),var(--bg)}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.06rem} h4{font-size:.95rem}
p{margin:0}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{display:block;max-width:100%}
.num,.tnum{font-variant-numeric:tabular-nums;font-family:var(--font-num)}
[dir="rtl"] .num,[dir="rtl"] .tnum{font-family:var(--font)}
.muted{color:var(--muted)} .t2{color:var(--text-2)} .small{font-size:.85rem} .xs{font-size:.76rem}
.ucontent{unicode-bidi:plaintext}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;inset-inline-start:12px;top:-60px;z-index:999;background:var(--violet);color:#fff;padding:10px 16px;border-radius:10px}
.skip-link:focus{top:12px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
::selection{background:rgba(139,92,246,.45);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px} .ic.lg{width:24px;height:24px} .ic.xl{width:32px;height:32px}
[dir="rtl"] .flip{transform:scaleX(-1)}
.hidden{display:none!important}

/* ---------- 3. SHELL ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:var(--s2);
  padding:var(--s4) var(--s3);background:linear-gradient(180deg,rgba(17,26,53,.9),rgba(11,16,38,.92));
  border-inline-end:1px solid var(--line);z-index:40;overflow:hidden}
[data-theme="daylight"] .sidebar{background:rgba(255,255,255,.86)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;color:var(--text)}
.brand:hover{text-decoration:none}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font-weight:800;letter-spacing:.32em;font-size:1.05rem}
.brand-tag{font-size:.68rem;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px;margin:0 -4px;scrollbar-width:thin}
.nav-group{margin:10px 0 4px;padding:0 12px;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
[dir="rtl"] .nav-group{letter-spacing:0;font-size:.74rem}
.nav a{position:relative;display:flex;align-items:center;gap:12px;min-height:40px;padding:8px 12px;margin:2px 4px;border-radius:12px;
  color:var(--text-2);font-weight:550;font-size:.93rem;transition:background var(--dur),color var(--dur)}
.nav a:hover{background:rgba(139,92,246,.10);color:var(--text);text-decoration:none}
.nav a[aria-current="page"]{color:var(--text);background:linear-gradient(90deg,rgba(139,92,246,.24),rgba(56,189,248,.08));box-shadow:inset 0 0 0 1px rgba(139,92,246,.28)}
[dir="rtl"] .nav a[aria-current="page"]{background:linear-gradient(270deg,rgba(139,92,246,.24),rgba(56,189,248,.08))}
.nav a[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-4px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--grad-brand)}
.nav a[aria-current="page"] .ic{color:var(--violet-2)}
.nav .badge{margin-inline-start:auto}
.sidebar-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.storage-note{font-size:.72rem;color:var(--muted);padding:4px 10px;display:flex;gap:6px;align-items:center}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:var(--topbar-h);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s6);
  background:rgba(8,13,31,.72);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
[data-theme="daylight"] .topbar{background:rgba(243,245,252,.82)}
.topbar .page-title{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding-inline:6px}
.clock b{font-size:1rem}.clock span{font-size:.72rem;color:var(--muted)}
.search-trigger{display:flex;align-items:center;gap:8px;height:40px;min-width:220px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.search-trigger:hover{border-color:var(--line-2);color:var(--text-2)}
.search-trigger kbd{margin-inline-start:auto}
kbd{font-family:var(--font-num);font-size:.72rem;padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2)}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.lang-switch button{border:0;background:transparent;padding:0 12px;height:38px;font-size:.85rem;color:var(--muted);font-weight:600}
.lang-switch button[aria-pressed="true"]{background:rgba(139,92,246,.22);color:var(--text)}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);transition:all var(--dur)}
.icon-btn:hover{color:var(--text);border-color:var(--line-2);background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:7px;inset-inline-end:7px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--pink);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--grad-brand);overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.12)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-btn{border:0;background:none;padding:0;border-radius:50%}
.save-pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);padding:4px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.save-pill i{width:7px;height:7px;border-radius:50%;background:var(--success)}
.save-pill[data-state="saving"] i{background:var(--blue);animation:pulse 1s infinite}
.save-pill[data-state="error"]{color:var(--danger);border-color:rgba(251,113,133,.4)} .save-pill[data-state="error"] i{background:var(--danger)}
.menu-btn{display:none}
.content{flex:1;padding:var(--s6);max-width:1480px;width:100%;margin:0 auto}
.view{animation:viewIn .32s var(--ease)}
.demo-banner{margin:var(--s4) var(--s6) 0;padding:10px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid rgba(251,191,36,.35);color:var(--text);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.bottom-nav{display:none}
.scrim{display:none}

/* ---------- 4. COMPONENTS ---------- */
.card{position:relative;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--bg)));border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow-1);min-width:0}
[data-theme="daylight"] .card{background:var(--surface)}
.card.flat{box-shadow:none}
.card.tight{padding:var(--s4)}
.card.accent{background:var(--grad-soft),var(--surface);border-color:rgba(139,92,246,.28)}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:var(--s4);min-width:0}.card-h h2,.card-h h3{flex:1 1 160px;min-width:0}
.card-h h2,.card-h h3{flex:1;min-width:0}
.card-h .ic{color:var(--violet-2)}
.card-sub{font-size:.82rem;color:var(--muted);margin-top:2px;font-weight:400}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:.78rem}
.grid{display:grid;gap:var(--s5)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:var(--s3);min-width:0} .row.wrap{flex-wrap:wrap} .row.top{align-items:flex-start}
.col{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.grow{flex:1;min-width:0} .end{margin-inline-start:auto}
.stack>*+*{margin-top:var(--s3)}
.divider{height:1px;background:var(--line);margin:var(--s4) 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--text);font-weight:600;font-size:.9rem;white-space:nowrap;transition:transform .12s,background var(--dur),border-color var(--dur),box-shadow var(--dur)}
.btn:hover{border-color:rgba(139,92,246,.45);background:var(--surface-3);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{border:0;background:var(--grad-btn);color:#fff;box-shadow:0 6px 20px rgba(109,90,240,.35)}
.btn.primary:hover{box-shadow:0 8px 28px rgba(109,90,240,.5);filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)} .btn.ghost:hover{background:rgba(139,92,246,.1);color:var(--text)}
.btn.danger{color:var(--danger);border-color:rgba(251,113,133,.35);background:var(--danger-bg)}
.btn.success{color:var(--success);border-color:rgba(52,211,153,.35);background:var(--success-bg)}
.btn.sm{min-height:32px;padding:0 10px;font-size:.82rem;border-radius:10px}
.btn.lg{min-height:50px;padding:0 24px;font-size:1rem;border-radius:14px}
.btn.icon{width:40px;padding:0} .btn.sm.icon{width:32px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:20px;font-size:.76rem;font-weight:600;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.v{color:var(--violet-2);border-color:rgba(139,92,246,.35);background:rgba(139,92,246,.12)}
.chip.b{color:var(--blue);border-color:rgba(56,189,248,.35);background:var(--info-bg)}
.chip.p{color:var(--pink);border-color:rgba(244,114,182,.35);background:rgba(244,114,182,.12)}
.chip.g{color:var(--success);border-color:rgba(52,211,153,.35);background:var(--success-bg)}
.chip.w{color:var(--warn);border-color:rgba(251,191,36,.35);background:var(--warn-bg)}
.chip.r{color:var(--danger);border-color:rgba(251,113,133,.35);background:var(--danger-bg)}
button.chip{cursor:pointer} button.chip[aria-pressed="true"]{background:rgba(139,92,246,.25);color:var(--text);border-color:rgba(139,92,246,.5)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:.7rem;font-weight:700;background:rgba(244,114,182,.18);color:var(--pink)}
.badge.v{background:rgba(139,92,246,.2);color:var(--violet-2)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.tabs a{flex:none;border:0;background:transparent;color:var(--muted);padding:0 14px;min-height:36px;border-radius:10px;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tabs a:hover{text-decoration:none;color:var(--text)}
.tabs [aria-selected="true"],.tabs [aria-current="true"]{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(56,189,248,.14));color:var(--text);box-shadow:inset 0 0 0 1px rgba(139,92,246,.3)}
.view-head{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.view-head .titles{flex:1;min-width:220px}
.view-head h1{display:flex;align-items:center;gap:10px}
.view-head .sub{color:var(--muted);margin-top:4px;font-size:.92rem}
.code-name{font-size:.68rem;letter-spacing:.2em;color:var(--violet-2);font-weight:800;text-transform:uppercase}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.field>label,.lbl{font-size:.8rem;font-weight:600;color:var(--text-2)}
.field .hint{font-size:.74rem;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--text);transition:border-color var(--dur),box-shadow var(--dur)}
[data-theme="daylight"] .input,[data-theme="daylight"] .select,[data-theme="daylight"] .textarea{background:#fff}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.22)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.textarea{min-height:96px;resize:vertical;line-height:1.6}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] .select{background-position:18px 55%,13px 55%}
input[type="range"]{width:100%;accent-color:var(--violet)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--violet);width:18px;height:18px}
input[type="color"]{width:42px;height:42px;padding:2px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-2)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.form-grid .full{grid-column:1/-1}
.form-err{color:var(--danger);font-size:.8rem}
.check{display:flex;align-items:center;gap:10px;min-height:36px;cursor:pointer;font-size:.9rem}
.switch{position:relative;width:44px;height:26px;flex:none;appearance:none;-webkit-appearance:none;border-radius:20px;background:var(--surface-3);border:1px solid var(--line-2);cursor:pointer;transition:background var(--dur)}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform var(--dur) var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch:checked{background:var(--violet);border-color:var(--violet)} .switch:checked::after{transform:translateX(18px)}
[dir="rtl"] .switch:checked::after{transform:translateX(-18px)}
.set-row{display:flex;align-items:center;gap:var(--s4);padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .grow b{display:block;font-weight:600;font-size:.92rem} .set-row .grow span{font-size:.8rem;color:var(--muted)}
/* progress */
.bar{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--grad-brand);transition:width .6s var(--ease)}
.bar.g>i{background:linear-gradient(90deg,#10B981,#34D399)} .bar.b>i{background:linear-gradient(90deg,#3B82F6,#38BDF8)} .bar.p>i{background:linear-gradient(90deg,#EC4899,#F472B6)}
.bar.thin{height:5px}
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ring-fg{transition:stroke-dashoffset .9s var(--ease)}
.ring .ring-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
/* lists */
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:var(--s3);padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid transparent;transition:background var(--dur),border-color var(--dur),transform var(--dur);min-width:0}
.item:hover{border-color:var(--line-2)}
.item.done .item-title{text-decoration:line-through;color:var(--muted)}
.item-title{font-weight:600;overflow-wrap:anywhere;min-width:0}
.item-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center;font-size:.76rem;color:var(--muted)}
.item .actions{display:flex;gap:4px;opacity:.75}
.item:hover .actions,.item:focus-within .actions{opacity:1}
.item.selected{border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.12)}
.item.overdue{box-shadow:inset 3px 0 0 var(--danger)} [dir="rtl"] .item.overdue{box-shadow:inset -3px 0 0 var(--danger)}
.tick{position:relative;width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line-2);background:transparent;display:grid;place-items:center;transition:all .2s var(--ease);padding:0}
.tick:hover{border-color:var(--violet)}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease)}
.tick[aria-checked="true"]{background:linear-gradient(135deg,var(--violet),var(--blue));border-color:transparent}
.tick[aria-checked="true"] svg{stroke-dashoffset:0}
.tick.round{border-radius:50%}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.prio.p1{background:var(--pink);box-shadow:0 0 0 3px rgba(244,114,182,.18)} .prio.p2{background:var(--violet-2)} .prio.p3{background:var(--blue)} .prio.p4{background:var(--muted)}
.drag-handle{cursor:grab;color:var(--muted);touch-action:none;display:grid;place-items:center;width:24px;height:32px;border:0;background:transparent;padding:0;border-radius:6px}
.drag-handle:active{cursor:grabbing}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.92;transform:rotate(-1.5deg);box-shadow:var(--shadow-2);max-width:340px}
.drop-hot{outline:2px dashed var(--violet)!important;outline-offset:2px;background:rgba(139,92,246,.08)!important}
.drop-before{box-shadow:0 -3px 0 0 var(--violet)!important}
/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:var(--s7) var(--s5);color:var(--muted)}
.empty svg.art{width:120px;height:90px;margin-bottom:6px}
.empty h3{color:var(--text)}
.empty p{max-width:420px;font-size:.9rem}
/* stats */
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:1.6rem;font-weight:750;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted)}
.kpi{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.kpi .k-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.k-ic.v{background:rgba(139,92,246,.16);color:var(--violet-2)} .k-ic.b{background:var(--info-bg);color:var(--blue)} .k-ic.p{background:rgba(244,114,182,.14);color:var(--pink)} .k-ic.g{background:var(--success-bg);color:var(--success)} .k-ic.w{background:var(--warn-bg);color:var(--warn)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:.86rem;background:var(--info-bg);border:1px solid rgba(56,189,248,.25);color:var(--text-2)}
.note.warn{background:var(--warn-bg);border-color:rgba(251,191,36,.3)} .note.ok{background:var(--success-bg);border-color:rgba(52,211,153,.3)} .note.err{background:var(--danger-bg);border-color:rgba(251,113,133,.3)}
.note .ic{flex:none;margin-top:1px}
.table{width:100%;border-collapse:collapse;font-size:.88rem}
.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.table th{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.scroll-x{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .gridline{stroke:var(--line);stroke-width:1}
.tooltip{position:fixed;z-index:1200;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);padding:6px 10px;border-radius:8px;font-size:.78rem;box-shadow:var(--shadow-2);color:var(--text)}
.dropdown{position:absolute;z-index:60;min-width:220px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-2);padding:6px}
.dropdown button,.dropdown a{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:6px 10px;border:0;background:none;border-radius:10px;color:var(--text-2);font-size:.88rem;text-align:start}
.dropdown button:hover,.dropdown a:hover{background:rgba(139,92,246,.12);color:var(--text);text-decoration:none}
.toasts{position:fixed;z-index:1300;bottom:20px;inset-inline-end:20px;display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:var(--shadow-2);animation:toastIn .3s var(--ease);font-size:.88rem}
.toast.ok{border-color:rgba(52,211,153,.4)} .toast.ok .ic{color:var(--success)}
.toast.err{border-color:rgba(251,113,133,.45)} .toast.err .ic{color:var(--danger)}
.toast.info .ic{color:var(--blue)} .toast.cele .ic{color:var(--pink)}
.toast .grow b{display:block}
.toast.out{opacity:0;transform:translateY(8px);transition:all .25s}

/* ---------- 5. VIEWS ---------- */
/* Home hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:var(--s7);min-height:300px;border:1px solid rgba(139,92,246,.25);
  background:radial-gradient(600px 300px at 15% 0%,rgba(139,92,246,.35),transparent 70%),radial-gradient(500px 300px at 100% 100%,rgba(244,114,182,.22),transparent 70%),radial-gradient(500px 260px at 70% 0%,rgba(56,189,248,.20),transparent 70%),linear-gradient(135deg,#121B3E,#0C1230);
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:var(--s6);align-items:center;box-shadow:var(--shadow-2)}
[data-theme="daylight"] .hero{background:radial-gradient(600px 300px at 15% 0%,rgba(116,68,232,.20),transparent 70%),radial-gradient(500px 300px at 100% 100%,rgba(217,70,143,.14),transparent 70%),radial-gradient(500px 260px at 70% 0%,rgba(14,143,203,.14),transparent 70%),linear-gradient(135deg,#FFFFFF,#EEF1FC)}
.hero .constellation{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.hero-text{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
.hero-greet{font-size:.95rem;color:var(--blue-2);font-weight:600;display:flex;align-items:center;gap:8px}
[data-theme="daylight"] .hero-greet{color:var(--blue)}
.hero h1{font-size:clamp(1.6rem,3.2vw,2.5rem);line-height:1.15;font-weight:800;letter-spacing:-.02em}
.grad-text{background:linear-gradient(90deg,#C4B5FD,#7DD3FC 50%,#F9A8D4);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="daylight"] .grad-text{background:linear-gradient(90deg,#7444E8,#0E8FCB 50%,#D9468F);-webkit-background-clip:text;background-clip:text}
.hero-focus{color:var(--text-2);font-size:1rem;max-width:560px}
.hero-date{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.86rem}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.hero-orbit{position:relative;z-index:1;display:grid;place-items:center}
.orbit-svg{width:100%;max-width:300px;aspect-ratio:1;overflow:visible}
.orbit-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.76rem;color:var(--text-2);margin-top:6px}
.orbit-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
.spin-slow{transform-origin:150px 150px;animation:spin 60s linear infinite}
.spin-mid{transform-origin:150px 150px;animation:spin 38s linear infinite reverse}
.spin-fast{transform-origin:150px 150px;animation:spin 24s linear infinite}
.core-pulse{transform-origin:150px 150px;animation:corePulse 5s ease-in-out infinite}
.twinkle{animation:twinkle 4s ease-in-out infinite}
.starfield{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55}
.home-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s5);margin-top:var(--s5)}
.span-12{grid-column:span 12} .span-8{grid-column:span 8} .span-7{grid-column:span 7} .span-6{grid-column:span 6} .span-5{grid-column:span 5} .span-4{grid-column:span 4} .span-3{grid-column:span 3}
.score-wrap{display:flex;gap:var(--s5);align-items:center;flex-wrap:wrap}
.score-break{flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px}
.score-break .row{font-size:.84rem}
.brief-q{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.brief-q .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none;background:rgba(139,92,246,.18);color:var(--violet-2)}
.brief-q .q{font-size:.76rem;color:var(--muted)} .brief-q .a{font-weight:600;overflow-wrap:anywhere}
.focus-card{background:radial-gradient(400px 200px at 100% 0%,rgba(56,189,248,.18),transparent 70%),radial-gradient(300px 200px at 0% 100%,rgba(139,92,246,.18),transparent 70%),var(--surface)}
.start-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4)}
.start-step{position:relative;padding:var(--s5);border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.start-step .step-n{font-size:.72rem;font-weight:800;color:var(--violet-2);letter-spacing:.12em}
.start-step.done{border-color:rgba(52,211,153,.35)} .start-step.done .step-n{color:var(--success)}
.journey{width:100%;height:60px}
.goal-card{display:flex;flex-direction:column;gap:10px;padding:var(--s4);border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line);transition:border-color var(--dur),transform var(--dur);min-width:0}
.goal-card:hover{border-color:rgba(139,92,246,.4)}
.goal-card .gtitle{font-weight:700;overflow-wrap:anywhere}
.northstar{background:radial-gradient(420px 220px at 90% 10%,rgba(244,114,182,.18),transparent 70%),radial-gradient(420px 220px at 10% 90%,rgba(139,92,246,.22),transparent 70%),var(--surface);border-color:rgba(244,114,182,.28)}
.ns-star{width:44px;height:44px;flex:none}
/* tasks */
.toolbar{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;margin-bottom:var(--s4)}
.quick-add{display:flex;gap:8px;flex:1;min-width:260px}
.quick-add .input{flex:1}
.bulk-bar{position:sticky;top:calc(var(--topbar-h) + 8px);z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface-3);border:1px solid rgba(139,92,246,.4);box-shadow:var(--shadow-2);margin-bottom:var(--s3)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:var(--s4);overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3);display:flex;flex-direction:column;gap:8px;min-height:200px}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-weight:700;font-size:.88rem}
.kcard{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.kcard:hover{border-color:var(--line-2)}
.eisen{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.quad{border-radius:var(--r-lg);padding:var(--s4);border:1px solid var(--line);min-height:180px;display:flex;flex-direction:column;gap:8px}
.quad.q1{background:linear-gradient(160deg,rgba(244,114,182,.12),var(--surface) 60%)} .quad.q2{background:linear-gradient(160deg,rgba(139,92,246,.14),var(--surface) 60%)}
.quad.q3{background:linear-gradient(160deg,rgba(56,189,248,.12),var(--surface) 60%)} .quad.q4{background:linear-gradient(160deg,rgba(140,152,191,.12),var(--surface) 60%)}
.nba{background:radial-gradient(500px 200px at 0% 0%,rgba(139,92,246,.22),transparent 70%),var(--surface);border-color:rgba(139,92,246,.3)}
.reason-list{display:flex;flex-wrap:wrap;gap:6px}
.subtasks .item{background:var(--bg-2);padding:6px 10px}
/* calendar */
.cal-head{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.cal-head h2{min-width:180px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.month .dow{font-size:.72rem;color:var(--muted);font-weight:700;text-align:center;padding:4px}
.mday{min-height:104px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:start;min-width:0;color:var(--text)}
.mday:hover{border-color:var(--line-2)}
.mday.out{opacity:.4} .mday.today{border-color:var(--violet);box-shadow:var(--glow-v)}
.mday.rest{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 8px,rgba(56,189,248,.06) 8px,rgba(56,189,248,.06) 16px)}
.mday .dnum{font-weight:700;font-size:.85rem;display:flex;justify-content:space-between;gap:4px}
.mday .hij{font-size:.66rem;color:var(--muted);font-weight:500}
.ev{font-size:.7rem;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(139,92,246,.18);color:var(--text);border-inline-start:3px solid var(--violet)}
.ev.task{background:rgba(56,189,248,.14);border-color:var(--blue)} .ev.ms{background:rgba(244,114,182,.14);border-color:var(--pink)} .ev.goal{background:rgba(52,211,153,.12);border-color:var(--success)} .ev.rest{background:rgba(140,152,191,.14);border-color:var(--muted)} .ev.block{background:rgba(139,92,246,.18);border-color:var(--violet-2)}
.timegrid{position:relative;display:grid;grid-template-columns:56px repeat(var(--cols,1),minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.tg-col{position:relative;border-inline-start:1px solid var(--line)}
.tg-hour{height:48px;border-bottom:1px solid var(--line);font-size:.64rem;color:var(--muted);padding:2px 4px;text-align:end;white-space:nowrap;overflow:hidden;letter-spacing:-.01em}
.tg-slot{height:24px;border-bottom:1px dashed transparent}
.tg-slot:nth-child(2n){border-bottom:1px solid var(--line)}
.tg-slot:hover{background:rgba(139,92,246,.06)}
.tg-head{position:sticky;top:0;z-index:2;padding:8px;text-align:center;font-size:.8rem;font-weight:700;background:var(--surface-2);border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);min-height:44px}
.tg-head.today{color:var(--violet-2)}
.tg-block{position:absolute;inset-inline:4px;border-radius:10px;padding:4px 8px;font-size:.74rem;overflow:hidden;cursor:pointer;border:1px solid rgba(139,92,246,.4);background:linear-gradient(160deg,rgba(139,92,246,.35),rgba(139,92,246,.18));color:var(--text);text-align:start;z-index:1}
.tg-block.task{border-color:rgba(56,189,248,.45);background:linear-gradient(160deg,rgba(56,189,248,.32),rgba(56,189,248,.14))}
.tg-block.rest{border-color:rgba(140,152,191,.4);background:rgba(140,152,191,.16)}
.tg-block.done{opacity:.55}
.tg-block b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-line{position:absolute;inset-inline:0;height:2px;background:var(--pink);z-index:3;box-shadow:0 0 8px var(--pink)}
.now-line::before{content:"";position:absolute;inset-inline-start:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--pink)}
.agenda-day{display:grid;grid-template-columns:120px 1fr;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
/* planner */
.capacity{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.cap-bar{position:relative;height:14px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.cap-bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.cap-bar i.over{background:linear-gradient(90deg,var(--warn),var(--pink))}
.top3 .slot{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px dashed var(--line-2);min-height:56px}
.top3 .slot.filled{border-style:solid;background:var(--surface-2)}
.top3 .rank{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--grad-brand);color:#fff;flex:none}
.mvd{background:radial-gradient(400px 200px at 100% 0%,rgba(244,114,182,.16),transparent 70%),var(--surface);border-color:rgba(244,114,182,.3)}
.energy-pick{display:flex;gap:6px}
.energy-pick button{flex:1;min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:700}
.energy-pick button:hover,.energy-pick button[aria-pressed="true"]{background:var(--grad-btn);color:#fff;border-color:transparent}
/* habits */
.habit{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s4);align-items:center;padding:var(--s4);border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.habit-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.week-dots{display:flex;gap:5px}
.week-dots i{width:22px;height:22px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;font-size:.6rem;font-style:normal;color:var(--muted)}
.week-dots i.ok{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff}
.week-dots i.part{background:rgba(139,92,246,.35);color:#fff}
.week-dots i.miss{background:transparent;border:1px dashed var(--line-2)}
.week-dots i.na{opacity:.35}
.week-dots i.today{box-shadow:0 0 0 2px var(--pink)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--surface-3)}
.heat i.l1{background:rgba(139,92,246,.35)} .heat i.l2{background:rgba(139,92,246,.6)} .heat i.l3{background:var(--violet)} .heat i.l4{background:var(--blue)}
.stack-chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack-node{padding:8px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);font-size:.85rem;font-weight:600}
.stack-arrow{color:var(--violet-2)}
.recovery{background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(139,92,246,.10)),var(--surface);border-color:rgba(56,189,248,.3)}
/* focus */
.focus-stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:var(--s5)}
.timer-card{display:flex;flex-direction:column;align-items:center;gap:var(--s5);padding:var(--s7) var(--s5);background:radial-gradient(500px 300px at 50% 0%,rgba(139,92,246,.22),transparent 70%),radial-gradient(400px 200px at 50% 100%,rgba(56,189,248,.12),transparent 70%),var(--surface)}
.timer-ring{position:relative;width:min(300px,72vw);aspect-ratio:1}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring .t-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.timer-digits{font-size:clamp(2.6rem,8vw,4rem);font-weight:300;letter-spacing:.02em;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.mode-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.distract-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.distract-grid button{min-height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);font-size:.82rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px}
.distract-grid button:hover{border-color:var(--pink);color:var(--text)}
/* focus mode overlay */
.focus-mode{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s6);padding:var(--s6);
  background:radial-gradient(800px 500px at 50% 30%,rgba(139,92,246,.22),transparent 70%),radial-gradient(600px 400px at 50% 100%,rgba(56,189,248,.12),transparent 70%),#060A18;color:#E8EDFF;animation:fadeIn .4s}
.focus-mode .fm-task{font-size:clamp(1.1rem,2.6vw,1.6rem);font-weight:700;text-align:center;max-width:720px}
.focus-mode .fm-int{color:#B7C1E3;text-align:center;max-width:600px}
.focus-mode .timer-digits{font-size:clamp(4rem,14vw,7.5rem)}
.focus-mode .fm-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.focus-mode .fm-distract{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;opacity:.8}
/* goals */
.goal-tree{display:flex;flex-direction:column;gap:8px}
.gnode{position:relative;margin-inline-start:calc(var(--lvl,0) * 26px)}
.gnode::before{content:"";position:absolute;inset-inline-start:-14px;top:-8px;bottom:50%;width:12px;border-inline-start:1px solid var(--line-2);border-bottom:1px solid var(--line-2);border-end-start-radius:8px}
.gnode[style*="--lvl:0"]::before{display:none}
.lvl-chip{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
/* projects */
.timeline{position:relative;overflow-x:auto}
.tl-grid{position:relative;min-width:720px}
.tl-row{display:grid;grid-template-columns:180px 1fr;align-items:center;min-height:44px;border-bottom:1px solid var(--line)}
.tl-track{position:relative;height:44px}
.tl-bar{position:absolute;top:10px;height:24px;border-radius:8px;background:var(--grad-btn);font-size:.72rem;color:#fff;padding:3px 8px;white-space:nowrap;overflow:hidden}
.tl-ms{position:absolute;top:14px;width:14px;height:14px;transform:rotate(45deg);background:var(--pink);border-radius:3px;margin-inline-start:-7px}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--pink);opacity:.6}
.pulse-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s3)}
.changelog{border-inline-start:2px solid var(--line-2);padding-inline-start:14px;display:flex;flex-direction:column;gap:10px}
.changelog div{position:relative;font-size:.84rem}
.changelog div::before{content:"";position:absolute;inset-inline-start:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--violet)}
/* journal */
.mood-pick{display:flex;gap:6px;flex-wrap:wrap}
.mood-pick button{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);font-size:.8rem;font-weight:700;padding:0 10px}
.mood-pick button[aria-pressed="true"]{background:var(--grad-btn);color:#fff;border-color:transparent}
.jentry{padding:var(--s4);border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line);cursor:pointer;text-align:start;width:100%;color:var(--text)}
.jentry:hover{border-color:var(--line-2)}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
/* balance */
.radar-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5);align-items:center}
.area-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.area-dot{width:12px;height:12px;border-radius:4px}
/* learning */
.skill-path{display:flex;flex-direction:column;gap:0;position:relative;padding-inline-start:8px}
.skill-stage{position:relative;display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.skill-stage .node{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--surface-2);font-weight:800;font-size:.8rem;z-index:1}
.skill-stage.done .node{background:var(--grad-brand);border-color:transparent;color:#fff}
.skill-stage.current .node{border-color:var(--pink);box-shadow:0 0 0 4px rgba(244,114,182,.18)}
.skill-stage:not(:last-child)::after{content:"";position:absolute;inset-inline-start:16px;top:44px;bottom:-10px;width:2px;background:var(--line-2)}
.skill-stage.done:not(:last-child)::after{background:linear-gradient(var(--violet),var(--blue))}
.flashcard{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);text-align:center;padding:var(--s7)}
.flashcard .q{font-size:1.25rem;font-weight:700}
/* quests */
.badge-tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:var(--s5);border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.badge-tile.locked{opacity:.55;filter:grayscale(.6)}
.badge-tile .medal{width:72px;height:72px}
.ch-days{display:flex;flex-wrap:wrap;gap:4px}
.ch-days i{width:16px;height:16px;border-radius:5px;background:var(--surface-3)}
.ch-days i.ok{background:linear-gradient(135deg,var(--violet),var(--pink))}
/* coach */
.coach-out{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface-2);padding:var(--s4)}
.disclaimer{font-size:.76rem;color:var(--muted);display:flex;gap:6px;align-items:center}
/* wizard */
.wizard-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s5)}
.wizard-steps span{flex:1;min-width:90px;height:6px;border-radius:6px;background:var(--surface-3)}
.wizard-steps span.on{background:var(--grad-brand)}
/* onboarding */
.welcome{min-height:100vh;display:grid;place-items:center;padding:var(--s6);position:relative;overflow:hidden}
.welcome-card{position:relative;z-index:1;width:min(980px,100%);display:grid;grid-template-columns:1.1fr .9fr;gap:var(--s7);align-items:center}
.welcome h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.value-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:var(--s5)}
.value-list div{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--text-2)}
.value-list .ic{color:var(--violet-2);margin-top:2px}
.setup{width:min(760px,100%);position:relative;z-index:1}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;font-size:.88rem;font-weight:600;text-align:start;color:var(--text);min-height:48px}
.pick[aria-pressed="true"]{border-color:var(--violet);background:rgba(139,92,246,.18);box-shadow:var(--glow-v)}

/* ---------- 6. OVERLAYS ---------- */
.modal-root{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:16px;background:rgba(3,6,18,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .2s}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-xl);box-shadow:var(--shadow-2);animation:modalIn .26s var(--ease);overflow:hidden}
.modal.lg{width:min(860px,100%)} .modal.sm{width:min(440px,100%)} .modal.xl{width:min(1100px,100%)}
.modal-h{display:flex;align-items:center;gap:12px;padding:var(--s5) var(--s6);border-bottom:1px solid var(--line)}
.modal-h h2{flex:1;font-size:1.12rem}
.modal-b{padding:var(--s5) var(--s6);overflow-y:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:var(--s4) var(--s6);border-top:1px solid var(--line);background:var(--bg-2)}
.palette{width:min(640px,100%);align-self:start;margin-top:10vh}
.palette .pal-input{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.palette .pal-input input{flex:1;border:0;background:transparent;font-size:1.05rem;outline:none;color:var(--text);min-width:0}
.pal-list{max-height:min(60vh,460px);overflow-y:auto;padding:8px}
.pal-group{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px;font-weight:700}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--text-2);text-align:start;min-height:44px}
.pal-item[aria-selected="true"]{background:rgba(139,92,246,.18);color:var(--text)}
.pal-item .sub{font-size:.76rem;color:var(--muted)}
.pal-item kbd{margin-inline-start:auto}
.notif-panel{position:fixed;top:calc(var(--topbar-h) + 8px);inset-inline-end:16px;z-index:950;width:min(400px,calc(100vw - 32px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-2);animation:modalIn .2s var(--ease);overflow:hidden}
.notif{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.86rem;cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:start;color:var(--text)}
.notif.unread{background:rgba(139,92,246,.08)}
.notif:hover{background:var(--surface-2)}
.confetti{position:fixed;pointer-events:none;z-index:1400;width:8px;height:12px;border-radius:2px;top:0;left:0;will-change:transform,opacity}
.splash{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
.splash.out{opacity:0;pointer-events:none}
.splash svg{width:84px;height:84px;animation:spin 3s linear infinite}

/* ---------- 7. MOTION ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes corePulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.06);opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes doneGlow{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}100%{box-shadow:0 0 0 14px rgba(52,211,153,0)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.just-done{animation:doneGlow .9s var(--ease)}
.just-done .tick{animation:pop .4s var(--ease)}
html.reduce-motion *,html.reduce-motion *::before,html.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* ---------- 8. RESPONSIVE ---------- */
@media (max-width:1280px){.span-3{grid-column:span 6}.span-4{grid-column:span 6}.span-5,.span-7{grid-column:span 12}.search-trigger{min-width:0}.search-trigger .lbl-txt,.search-trigger kbd{display:none}.pulse-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){
  :root{--sidebar-w:78px}
  .sidebar .brand-text,.sidebar .nav-group,.sidebar .nav a span,.sidebar .nav .badge,.sidebar .storage-note span{display:none}
  .sidebar .nav a{justify-content:center;padding:8px}
  .sidebar .brand{justify-content:center;padding-inline:0}
  .span-8,.span-6{grid-column:span 12}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .focus-stage{grid-template-columns:1fr}
  .start-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clock{display:none}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  :root{--sidebar-w:288px;--topbar-h:58px}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:var(--sidebar-w);transform:translateX(-105%);transition:transform .28s var(--ease);box-shadow:var(--shadow-2)}
  [dir="rtl"] .sidebar{transform:translateX(105%)}
  .sidebar.open{transform:none!important}
  .sidebar .brand-text,.sidebar .nav-group,.sidebar .nav a span,.sidebar .nav .badge,.sidebar .storage-note span{display:initial}
  .sidebar .nav a{justify-content:flex-start;padding:8px 12px}.sidebar .brand{justify-content:flex-start;padding-inline:10px}
  .scrim.show{display:block;position:fixed;inset:0;z-index:35;background:rgba(3,6,18,.55)}
  .menu-btn{display:inline-grid}
  .topbar{padding:0 var(--s3);gap:8px}
  .content{padding:var(--s4) var(--s3) calc(var(--s8) + 64px)}
  .demo-banner{margin:var(--s3) var(--s3) 0}
  .save-pill .lbl-txt{display:none}
  .lang-switch button{padding:0 8px}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;inset-inline:0;z-index:30;height:64px;padding-bottom:env(safe-area-inset-bottom);background:rgba(11,16,38,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  [data-theme="daylight"] .bottom-nav{background:rgba(255,255,255,.92)}
  .bottom-nav a,.bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.66rem;color:var(--muted);border:0;background:none;font-weight:600}
  .bottom-nav [aria-current="page"]{color:var(--violet-2)}
  .bottom-nav a:hover{text-decoration:none}
  .hero{grid-template-columns:1fr;padding:var(--s5);min-height:0}
  .hero-orbit{order:-1}.orbit-svg{max-width:220px}
  .home-grid{gap:var(--s4)}
  .g2,.g3{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .eisen{grid-template-columns:1fr}
  .capacity{grid-template-columns:repeat(2,minmax(0,1fr))}
  .radar-wrap{grid-template-columns:1fr}
  .welcome-card{grid-template-columns:1fr;gap:var(--s5)}
  .value-list{grid-template-columns:1fr}
  .toasts{bottom:76px;inset-inline:16px}
  .agenda-day{grid-template-columns:1fr;gap:6px}
  .pulse-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal-root{padding:0;align-items:end}
  .modal{max-height:94vh;border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%!important}
  .palette{margin-top:0;align-self:end}
  .habit{grid-template-columns:auto 1fr;}
  .habit>.h-actions{grid-column:1/-1}
  .mday{min-height:64px;padding:4px}.mday .ev{display:none}.mday .evdot{display:flex}
  .tl-row{grid-template-columns:120px 1fr}
  .view-head h1{font-size:1.4rem}
}
@media (min-width:821px){.mday .evdot{display:none}}
@media (max-width:480px){
  html{font-size:14.5px}
  .g4,.start-steps,.capacity{grid-template-columns:1fr}
  .topbar .page-title{font-size:.95rem}
  .search-trigger{display:none}
  .card{padding:var(--s4)}
  .hero h1{font-size:1.5rem}
  .btn.lg{width:100%}
  .week-dots i{width:18px;height:18px}
  .kanban{grid-auto-columns:minmax(230px,86vw)}
  .pulse-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:360px){.lang-switch button{padding:0 6px;font-size:.75rem}.icon-btn{width:36px;height:36px}}
@media print{
  .sidebar,.topbar,.bottom-nav,.toasts,.starfield,.demo-banner{display:none!important}
  body{background:#fff;color:#000}.app{display:block}.card{box-shadow:none;border-color:#ccc;break-inside:avoid}
}

/* ---------- Onboarding ---------- */
.onb{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden}
.onb-bg{position:absolute;inset:50% auto auto 50%;width:min(1100px,160vw);height:auto;transform:translate(-50%,-50%);pointer-events:none;opacity:.9}
.onb-bg .spin-slow{transform-origin:400px 400px}
.onb-card{position:relative;width:min(620px,100%);display:flex;flex-direction:column;gap:18px;padding:clamp(20px,4vw,36px);backdrop-filter:blur(10px)}
.onb-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0}
.onb-hero h1{font-size:clamp(2.2rem,7vw,3.2rem);letter-spacing:.18em;font-weight:800}
.lead{font-size:1.12rem;color:var(--text);line-height:1.6}
.onb-progress{display:flex;gap:6px}.onb-progress i{flex:1;height:4px;border-radius:4px;background:var(--surface-3);transition:background .3s}
.onb-progress i.on{background:linear-gradient(90deg,var(--violet),var(--blue))}
/* ---------- Weekly Reset stepper ---------- */
.stepper{list-style:none;display:flex;gap:8px;padding:0;margin:0 0 18px;overflow-x:auto}
.stepper li{flex:1;min-width:max-content}
.stepper button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:.84rem}
.stepper .step-n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-3);font-size:.75rem;font-weight:700}
.stepper li.done .step-n{background:rgba(52,211,153,.2);color:var(--success)}
.stepper li.cur button{border-color:rgba(139,92,246,.55);color:var(--text);background:rgba(139,92,246,.1)}
.stepper li.cur .step-n{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff}
@media (max-width:640px){.stepper .lbl-txt{display:none}.stepper li.cur .lbl-txt{display:inline}}
mark{background:rgba(139,92,246,.32);color:inherit;border-radius:3px;padding:0 2px}

/* narrow screens: let long buttons wrap instead of overflowing */
@media (max-width:480px){.card-h .btn,.row .btn{white-space:normal;max-width:100%;text-align:start}}
@media (max-width:420px){.lang-switch button[aria-pressed="true"]{display:none}.topbar .save-pill{display:none}}
ul.reason-list{list-style:none;margin:0;padding:0;flex-direction:column;flex-wrap:nowrap;gap:8px}ul.reason-list li{display:flex;align-items:flex-start;gap:8px;font-size:.875rem;line-height:1.5;color:var(--text-2,#A9B4D6)}ul.reason-list li>svg{flex:none;margin-top:3px;color:var(--blue)}
</style>

<body>
<a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>

<!-- Boot splash (removed once data is loaded) -->
<div class="splash" id="splash" aria-hidden="true">
  <svg viewBox="0 0 100 100"><defs><linearGradient id="spg" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".6" stop-color="#38BDF8"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs>
    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(160,174,255,.15)" stroke-width="4"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#spg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="80 260"/>
    <circle cx="50" cy="50" r="10" fill="#A78BFA"/></svg>
</div>

<!-- Decorative star field (generated by JS, hidden in Focus theme / when decor is off) -->
<svg class="starfield decor" id="starfield" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>

<!-- Application root: welcome / onboarding / main shell is rendered here -->
<div id="root"></div>

<!-- Live regions & overlay hosts -->
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="overlays"></div>
<div class="tooltip hidden" id="tooltip" role="tooltip"></div>

<noscript><div style="padding:40px;text-align:center;color:#E8EDFF;background:#080D1F;font-family:system-ui">ORION requires JavaScript. / يتطلب ORION تفعيل JavaScript.</div></noscript>

<!-- =====================================================================
     SVG SPRITE — icons (stroke based, 24×24) + shared gradients
     Kept 0×0 (not display:none) so gradients render everywhere.
     ===================================================================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gBrand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>

/* Build the dictionaries: I18N.en / I18N.ar. Rows without Arabic fall back to English. */
const I18N = { en: {}, ar: {} };
(function buildI18N() {
  for (const chunk of window.I18N_RAW) {
    for (const line of chunk.split('\n')) {
      if (!line || line.indexOf('¦') < 0) continue;
      const [key, en, ar] = line.split('¦');
      I18N.en[key.trim()] = en;
      I18N.ar[key.trim()] = ar || en;
    }
  }
  delete window.I18N_RAW;
})();

    }).join('');

    return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(aria)}">${grid}${paths}${lbl}</svg>`;
  },
  radar({ axes, sets, size = 320, max = 10 }) {
    const c = size / 2, R = size / 2 - 46, n = axes.length; if (n < 3) return '';
    const P = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n * (isRTL() ? -1 : 1); return [c + Math.cos(a) * R * v / max, c + Math.sin(a) * R * v / max]; };
    let g = '';
    for (let k = 1; k <= 5; k++) g += `<polygon points="${axes.map((_, i) => P(i, max * k / 5).join(',')).join(' ')}" fill="none" stroke="var(--line-2)" stroke-width="1"/>`;
    g += axes.map((a, i) => { const [x, y] = P(i, max); const [lx, ly] = P(i, max * 1.2); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" style="font-size:10.5px;fill:var(--text-2)">${esc(a.label)}</text>`; }).join('');
    const polys = sets.map(s => `<polygon points="${s.data.map((v, i) => P(i, v || 0).join(',')).join(' ')}" fill="${s.color}" fill-opacity="${s.fill ?? .22}" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>` + s.data.map((v, i) => { const [x, y] = P(i, v || 0); return `<circle cx="${x}" cy="${y}" r="3.5" fill="${s.color}" data-tip="${esc(axes[i].label + ' · ' + s.name + ': ' + F.num(v || 0))}"/>`; }).join('')).join('');
    return `<svg class="chart" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(t('bal.radar'))}">${g}${polys}</svg>`;
  },
  spark(data, color = 'var(--violet-2)', w = 120, h = 32) {
    if (!data.length) return ''; const mx = Math.max(1, ...data);
    const pts = data.map((v, i) => `${(data.length === 1 ? w / 2 : i * w / (data.length - 1))},${h - 3 - (h - 6) * v / mx}`).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="${isRTL() ? 'transform:scaleX(-1)' : ''}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  },
  hbars(items, { fmt = v => F.num(v), color = 'var(--violet)' } = {}) {
    const mx = Math.max(1, ...items.map(i => i.v));
    return `<div class="col" style="gap:10px">${items.map(i => `<div><div class="row small"><span class="grow ucontent">${esc(i.l)}</span><b class="num">${fmt(i.v)}</b></div><div class="bar thin" style="margin-top:4px"><i style="width:${i.v / mx * 100}%;${i.c ? `background:${i.c}` : ''}"></i></div></div>`).join('')}</div>`;
  }
};

/* ---------- 8. ROUTER & SHELL ---------- */
const NAV = [
  { g: 'command', items: [['home', 'home'], ['myday', 'sun'], ['tasks', 'tasks'], ['calendar', 'calendar'], ['focus', 'target']] },
  { g: 'growth', items: [['habits', 'repeat'], ['goals', 'flag'], ['projects', 'folder'], ['learning', 'grad'], ['balance', 'compass']] },

const Views = {};
function parseHash() {

function setParam(k, v) { const p = { ...S.route.params, [k]: v }; if (v == null || v === '') delete p[k]; go(S.route.name, p); }

function brandMark(size = 38) {

function navHTML() {

function shellHTML() {

      <span class="save-pill" id="savePill" data-state="ok" role="status"><i></i><span class="lbl-txt">${esc(DB.mode === 'memory' ? t('save.memory') : t('save.saved'))}</span></span>

      <div class="lang-switch" role="group" aria-label="${esc(t('set.language'))}"><button data-act="setLang" data-lang="ar" aria-pressed="${S.lang === 'ar'}" lang="ar">العربية</button><button data-act="setLang" data-lang="en" aria-pressed="${S.lang === 'en'}" lang="en">English</button></div>
      <button class="icon-btn" data-act="toggleNotif" id="notifBtn" aria-label="${esc(t('notif.title'))}">${icon('bell')}<span class="dot hidden" id="notifDot"></span></button>

  <nav class="bottom-nav" aria-label="${esc(t('a11y.quickNav'))}">
    ${[['home', 'home'], ['myday', 'sun'], ['tasks', 'tasks'], ['focus', 'target']].map(([k, ic]) => `<a href="#/${k}" data-nav="${k}">${icon(ic)}<span>${esc(t('nav.' + k))}</span></a>`).join('')}
    <button data-act="openNav" aria-label="${esc(t('a11y.openMenu'))}">${icon('menu')}<span>${esc(t('c.more'))}</span></button>
  </nav></div>`;
}

const App = {
  _raf: 0,
  mountShell() {
    if (!S.prefs.onboarded) { Onboarding.render(); return; }
    $('#root').innerHTML = shellHTML();
    this.updateShell(); this.tickClock(); this.renderView(true);
  },
  renderView(routeChanged = false) {
    const host = $('#view'); if (!host) return;
    const name = Views[S.route.name] ? S.route.name : 'home';
    const v = Views[name];
    // preserve focus & caret across data-driven re-renders
    const ae = document.activeElement; const fid = !routeChanged && ae && host.contains(ae) ? ae.id : null;
    let selS = null, selE = null; try { if (fid) { selS = ae.selectionStart; selE = ae.selectionEnd; } } catch { }
    const keep = routeChanged ? [] : $$('[data-keep-scroll]', host).map(el => [el.dataset.keepScroll, el.scrollLeft, el.scrollTop]);
    let html;
    try { html = v.render(S.route.params); } catch (err) { console.error(err); html = `<div class="card"><div class="empty">${icon('alert', 'xl')}<h3>${esc(t('err.view'))}</h3><p>${esc(String(err.message || err))}</p><button class="btn" data-act="go" data-to="home">${esc(t('nav.home'))}</button></div></div>`; }
    host.innerHTML = `<div class="${routeChanged ? 'view' : ''}" data-view="${name}">${html}</div>`;
    try { v.mount?.(host, S.route.params); } catch (err) { console.error(err); }
    keep.forEach(([k, l, tp]) => { const el = host.querySelector(`[data-keep-scroll="${k}"]`); if (el) { el.scrollLeft = l; el.scrollTop = tp; } });
    if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selE); } catch { } } }
    $$('[data-nav]').forEach(a => a.dataset.nav === name ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    const title = t('nav.' + name); $('#pageTitle').textContent = title; document.title = `${title} · ORION`;
    if (routeChanged) { window.scrollTo(0, 0); this.closeNav(); }
  },
  schedule() { if (this._raf) return; this._raf = requestAnimationFrame(() => { this._raf = 0; if (!S.prefs.onboarded) return; this.renderView(false); this.updateShell(); }); },
  updateShell() {
    const nav = $('#nav'); if (nav) { const st = nav.scrollTop; nav.innerHTML = navHTML(); nav.scrollTop = st; $$('[data-nav]').forEach(a => a.dataset.nav === S.route.name ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')); }
    const unread = DB.filter('notifications', n => !n.read).length; const dot = $('#notifDot');
    if (dot) { dot.classList.toggle('hidden', !unread); dot.textContent = unread > 9 ? '9+' : F.num(unread); }
    const hasDemo = STORES.some(s => DB.find(s, r => r.demo));
    const db = $('#demoBanner'); if (db) db.innerHTML = hasDemo ? `<div class="demo-banner" role="note">${icon('info')}<span class="grow">${esc(t('demo.banner'))}</span><button class="btn sm" data-act="demoClear">${esc(t('demo.clear'))}</button></div>` : '';
  },
  tickClock() {
    const el = $('#clockTime'); if (!el) return;
    el.textContent = F.minTime(D.nowMin()); $('#clockDate').textContent = F.date(D.today(), 'med');
  },
  openNav() { $('#sidebar')?.classList.add('open'); $('#scrim')?.classList.add('show'); $('#sidebar a[aria-current]')?.focus(); },
  closeNav() { $('#sidebar')?.classList.remove('open'); $('#scrim')?.classList.remove('show'); }
};

/* Delegated interaction system: data-act (click), data-form (submit), data-change, data-input */
const A = {}, FORMS = {}, CH = {}, INP = {};
function runSafe(p) { Promise.resolve(p).catch(err => { console.error(err); if (!/save/i.test(String(err?.message))) toast(t('err.generic'), 'err'); }); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = A[el.dataset.act]; if (!fn) { console.warn('No action', el.dataset.act); return; }
  if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
  runSafe(fn(el, e));
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  if (f.dataset.busy) return; f.dataset.busy = '1';
  const fn = FORMS[f.dataset.form];
  Promise.resolve(fn ? fn(new FormData(f), f) : null).catch(err => { console.error(err); if (!/save/i.test(String(err?.message))) toast(t('err.generic'), 'err'); }).finally(() => { delete f.dataset.busy; });
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CH[el.dataset.change]) runSafe(CH[el.dataset.change](el, e)); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e); });
function fd(form) { const o = {}; for (const [k, v] of form.entries()) { if (k in o) { o[k] = [].concat(o[k], v); } else o[k] = typeof v === 'string' ? v.trim() : v; } return o; }
function fieldErr(form, name, msg) {
  const el = form.querySelector(`[name="${name}"]`); if (!el) { toast(msg, 'err'); return false; }
  el.setAttribute('aria-invalid', 'true'); let er = el.parentElement.querySelector('.form-err');
  if (!er) { er = document.createElement('span'); er.className = 'form-err'; er.setAttribute('role', 'alert'); el.insertAdjacentElement('afterend', er); }
  er.textContent = msg; el.focus(); el.addEventListener('input', () => { el.removeAttribute('aria-invalid'); er.remove(); }, { once: true });
  return false;
}

A.go = el => go(el.dataset.to, el.dataset.params ? JSON.parse(el.dataset.params) : undefined);
A.openNav = () => App.openNav();
A.closeNav = () => App.closeNav();
A.setParam = el => setParam(el.dataset.k, el.dataset.v);
A.noop = () => { };
</script>

<script>
'use strict';
/* =====================================================================
   ORION — DOMAIN LOGIC (rule-based, transparent, no AI)
   Tasks · Calendar · Day plans & Reality-Based Planning · Habits engine
   Focus timer · Goals & North Star · Projects · Journal · Daily Score
   Daily Brief · Next Best Action · Points · Achievements · Challenges
   Notifications & reminders · Templates · Audit log
   ===================================================================== */
const PRIOS = ['p1', 'p2', 'p3', 'p4'];
const PRIO_W = { p1: 4, p2: 3, p3: 2, p4: 1 };
const STATUSES = ['todo', 'doing', 'done', 'postponed', 'cancelled'];
const RECURS = ['none', 'daily', 'weekdays', 'weekly', 'monthly', 'yearly'];
const isOpenStatus = s => s === 'todo' || s === 'doing';
const today = () => D.today();

const Audit = { log(action, detail = '') { DB.put('audit_events', { id: uid(), action, detail: String(detail).slice(0, 200), at: nowISO() }, { quiet: true }).catch(() => { }); } };

/* ---------- Life areas (renamable / hideable) ---------- */
const Areas = {
  list(all = false) { return (S.prefs.lifeAreas || []).filter(a => all || !a.hidden).map(a => ({ ...a, label: a.name || t('area.' + a.id), icon: (LIFE_AREAS.find(x => x.id === a.id) || {}).icon || 'compass' })); },
  get(id) { return this.list(true).find(a => a.id === id); },
  label(id) { return this.get(id)?.label || ''; },
  options(cur) { return `<option value="">${esc(t('c.none'))}</option>` + this.list().map(a => `<option value="${a.id}"${sel(cur, a.id)}>${esc(a.label)}</option>`).join(''); }
};

/* ---------- Tasks ---------- */
const Tasks = {
  all() { return DB.filter('tasks', x => !x.deletedAt); },
  live() { return DB.filter('tasks', x => !x.deletedAt && !x.archived); },
  get(id) { const x = DB.get('tasks', id); return x && !x.deletedAt ? x : null; },
  isOpen(x) { return isOpenStatus(x.status); },
  overdue(x) { return isOpenStatus(x.status) && x.due && x.due < today(); },
  blockedBy(x) { return (x.deps || []).map(id => DB.get('tasks', id)).filter(d => d && !d.deletedAt && d.status !== 'done' && d.status !== 'cancelled'); },
  unblocks(x) { return this.live().filter(y => isOpenStatus(y.status) && (y.deps || []).includes(x.id)).length; },
  forDay(ds) { const top = new Set(Plan.get(ds).top3 || []); return this.live().filter(x => x.status !== 'cancelled' && (x.due === ds || top.has(x.id))); },
  completedOn(ds) { return this.all().filter(x => x.status === 'done' && x.completedAt && D.isoLocal(x.completedAt).date === ds); },
  area(x) { return x.areaId || DB.get('projects', x.projectId)?.areaId || DB.get('goals', x.goalId)?.areaId || ''; },
  dur(x) { if (x.estimate) return +x.estimate; const s = D.toMin(x.start), e = D.toMin(x.end); return s != null && e != null && e > s ? e - s : 0; },
  sort(list) { return sortBy(list, (a, b) => (a.order ?? 0) - (b.order ?? 0)); },
  smartSort(list) { return sortBy(list, (a, b) => (isOpenStatus(b.status) - isOpenStatus(a.status)), (a, b) => PRIO_W[b.priority] - PRIO_W[a.priority], (a, b) => (a.due || '9999').localeCompare(b.due || '9999')); },
  blank() { return { title: '', desc: '', due: '', start: '', end: '', priority: 'p3', status: 'todo', projectId: '', goalId: '', milestoneId: '', areaId: '', tags: [], estimate: 0, actual: 0, subtasks: [], notes: '', recur: { freq: 'none', interval: 1 }, deps: [], archived: false, completedAt: null }; },
  validate(x) {
    if (!x.title || !x.title.trim()) return ['title', t('val.required')];
    if (x.title.length > 300) return ['title', t('val.tooLong', { n: 300 })];
    if (x.due && !D.valid(x.due)) return ['due', t('val.date')];
    if (x.estimate && (x.estimate < 0 || x.estimate > 1440)) return ['estimate', t('val.range', { a: 0, b: 1440 })];
    if (x.start && x.end && D.toMin(x.end) <= D.toMin(x.start)) return ['end', t('val.endAfter')];
    return null;
  },
  async create(patch) {
    const minOrder = Math.min(0, ...this.live().map(x => x.order ?? 0));
    const rec = { ...this.blank(), id: uid(), order: minOrder - 1, ...patch };
    await DB.put('tasks', rec); Projects.touch(rec.projectId); return rec;
  },
  async update(id, patch) {
    const old = DB.get('tasks', id); if (!old) return;
    const rec = { ...old, ...patch };
    await DB.put('tasks', rec);
    if (patch.status && patch.status !== old.status) await this.afterStatus(old, rec);
    Projects.touch(rec.projectId); return rec;
  },
  async setStatus(id, status) { return this.update(id, { status, completedAt: status === 'done' ? (DB.get('tasks', id)?.completedAt || nowISO()) : null }); },
  async toggle(id) { const x = this.get(id); if (!x) return; return this.setStatus(id, x.status === 'done' ? 'todo' : 'done'); },
  async afterStatus(old, rec) {
    if (rec.status === 'done' && old.status !== 'done') {
      const pts = await Points.award('task:' + rec.id, { p1: 10, p2: 7, p3: 4, p4: 2 }[rec.priority] || 3, 'pts.task');
      if (rec.recur?.freq && rec.recur.freq !== 'none' && !rec.spawnedNext) await this.spawnNext(rec);
      if (rec.projectId) await Projects.log(rec.projectId, 'log.taskDone', { title: rec.title });
      FX.taskDone(rec, pts);
    }
  },
  nextDue(x) {
    const base = x.due || today(); const n = Math.max(1, +x.recur?.interval || 1); let nd;
    const step = d => { switch (x.recur.freq) { case 'daily': return D.add(d, n); case 'weekdays': { let y = D.add(d, 1); while ((S.prefs.restWeekdays || []).includes(D.dow(y))) y = D.add(y, 1); return y; } case 'weekly': return D.add(d, 7 * n); case 'monthly': return D.addMonths(d, n); case 'yearly': return D.addMonths(d, 12 * n); } return null; };
    nd = step(base); let guard = 0; while (nd && nd < today() && guard++ < 400) nd = step(nd);
    return nd;
  },
  async spawnNext(x) {
    const nd = this.nextDue(x); if (!nd) return;
    await DB.put('tasks', { ...x, spawnedNext: true }, { quiet: true });
    await this.create({ ...x, id: uid(), due: nd, status: 'todo', completedAt: null, actual: 0, spawnedNext: false, subtasks: (x.subtasks || []).map(s => ({ ...s, id: uid(), done: false })), recurFrom: x.id, createdAt: undefined });
  },
  async trash(ids) {
    const recs = ids.map(id => DB.get('tasks', id)).filter(Boolean).map(x => ({ ...x, deletedAt: nowISO() }));
    await DB.putMany('tasks', recs);
    toast(t('task.trashed', { n: recs.length }), 'info', { action: { label: t('c.undo'), fn: () => runSafe(Tasks.restore(ids)) } });
  },
  async restore(ids) { await DB.putMany('tasks', ids.map(id => DB.get('tasks', id)).filter(Boolean).map(x => ({ ...x, deletedAt: null }))); },
  async purgeOld() {
    const lim = Date.now() - (S.prefs.trashDays || 30) * 864e5;
    const ids = DB.filter('tasks', x => x.deletedAt && new Date(x.deletedAt).getTime() < lim).map(x => x.id);
    if (ids.length) await DB.delMany('tasks', ids, { quiet: true });
  },
  /** Quick-add parser: "#tag", "!1..!4" priority, "@today" / "@tomorrow", "~30m" estimate */
  /** Quick-add grammar: #tag · p1–p4 or !1–!4 · today/tomorrow (optional @, AR too) · 30m / 1h / 1h30m / ~30 */
  parseQuick(s) {
    const out = { tags: [] }; let title = ' ' + s + ' ';
    title = title.replace(/(\s)#([\p{L}\p{N}_-]+)(?=\s)/gu, (_, a, tg) => { out.tags.push(tg); return a; });
    title = title.replace(/(\s)(?:!|p)([1-4])(?=\s)/gi, (_, a, p) => { out.priority = 'p' + p; return a; });
    title = title.replace(/(\s)@?(today|tomorrow|اليوم|غدا|غدًا|بكرة)(?=\s)/gi, (_, a, w) => { out.due = /today|اليوم/i.test(w) ? today() : D.add(today(), 1); return a; });
    title = title.replace(/(\s)(?:(\d{1,2})h(?:(\d{1,2})m)?|~?(\d{1,4})(?:m|min|د)|~(\d{1,4}))(?=\s)/gi, (_, a, h, hm, m, m2) => { const v = h ? +h * 60 + (+hm || 0) : +(m || m2); if (v > 0 && v <= 1440) out.estimate = v; return a; });
    out.title = title.replace(/\s+/g, ' ').trim(); return out;
  }
};

/* ---------- Calendar ---------- */
const Cal = {
  events() { return DB.all('calendar_events'); },
  occ(ev, from, to) {
    const f = ev.recur || 'none'; const out = []; if (!ev.date) return out;

  items(ds) {

};

/* ---------- Day plans & Reality-Based Planning ---------- */
const Plan = {
  get(ds) { return DB.get('day_plans', ds) || { id: ds, top3: [], mvdOn: false, mvd: {}, start: '', end: '', breakMin: null, planned: false }; },
  async save(ds, patch) { const r = { ...this.get(ds), ...patch }; if (patch.top3?.length || patch.mvdOn || patch.blocks) r.planned = true; await DB.put('day_plans', r); },
  window(ds) { const p = this.get(ds); const s = D.toMin(p.start || S.prefs.dayStart) ?? 480; const e = D.toMin(p.end || S.prefs.dayEnd) ?? 1020; return { s, e: Math.max(e, s) }; },
  breakMin(ds) { const p = this.get(ds); return +(p.breakMin ?? S.prefs.breakMin ?? 0); },
  merge(iv) { const a = sortBy(iv.filter(x => x.e > x.s), (x, y) => x.s - y.s); const out = []; for (const x of a) { const l = out[out.length - 1]; if (l && x.s <= l.e) l.e = Math.max(l.e, x.e); else out.push({ ...x }); } return out; },
  capacity(ds, fromMin = null) {
