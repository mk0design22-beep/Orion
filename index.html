    const fixed = Cal.on(ds).filter(o => !o.ev.allDay && o.ev.type !== 'rest' && o.ev.type !== 'block' && o.ev.start && o.ev.end).map(o => ({ s: D.toMin(o.ev.start), e: D.toMin(o.ev.end) }));
    const clip = iv => iv.map(x => ({ s: Math.max(x.s, start), e: Math.min(x.e, e) })).filter(x => x.e > x.s);
    const fixedM = this.merge(clip(fixed)); const eventsMin = sum(fixedM.map(x => x.e - x.s));
    const breaks = fromMin != null ? Math.round(this.breakMin(ds) * (e - start) / Math.max(1, e - s)) : this.breakMin(ds);
    const avail = Math.max(0, e - start - eventsMin - breaks);
    const tasks = Tasks.forDay(ds).filter(x => isOpenStatus(x.status));
    const est = sum(tasks.map(x => Tasks.dur(x)));
    const unestimated = tasks.filter(x => !Tasks.dur(x)).length;
    const blocks = Cal.on(ds).filter(o => o.ev.type === 'block' && o.ev.start && o.ev.end).map(o => ({ s: D.toMin(o.ev.start), e: D.toMin(o.ev.end) }));
    const timed = tasks.filter(x => x.start && x.end).map(x => ({ s: D.toMin(x.start), e: D.toMin(x.end) }));
    const busy = this.merge(clip([...fixed, ...blocks, ...timed]));
    const gaps = []; let cur = start; busy.forEach(b => { if (b.s - cur >= 15) gaps.push({ s: cur, e: b.s }); cur = Math.max(cur, b.e); }); if (e - cur >= 15) gaps.push({ s: cur, e });
    const over = est - avail;
    const top = new Set(this.get(ds).top3 || []);
    const reschedule = []; if (over > 0) { let need = over; for (const x of sortBy(tasks.filter(x => !top.has(x.id) && !x.start), (a, b) => PRIO_W[a.priority] - PRIO_W[b.priority], (a, b) => Tasks.dur(b) - Tasks.dur(a))) { if (need <= 0) break; reschedule.push(x); need -= Tasks.dur(x) || 15; } }
    return { start, end: e, breaks, eventsMin, avail, est, over, gaps, reschedule, unestimated, tasks };
  },
  remainingToday() { return this.capacity(today(), D.nowMin()).avail; }
};

/* ---------- Habits engine ---------- */

const HABIT_ICONS = ['book', 'activity', 'droplet', 'brain', 'pen', 'heart', 'leaf', 'moon', 'sun', 'dumbbell', 'coffee', 'music', 'star', 'zap', 'target', 'smile'];

  weekDone(h, ds) { return D.range(D.weekStart(ds), 7).filter(d => this.doneOn(h, d)).length; },

  okOn(h, ds) { return this.weekly(h) ? (this.doneOn(h, ds) || this.weekDone(h, ds) >= this.perWeek(h)) : this.doneOn(h, ds); },

  stats(h) {

  level(r) { if (r == null) return 'new'; return r >= .8 ? 'strong' : r >= .5 ? 'steady' : 'building'; },

/* ---------- Focus sessions & timer ---------- */
const Focus = {
  sessions() { return DB.filter('focus_sessions', s => s.kind === 'focus'); },
  on(ds) { return this.sessions().filter(s => s.date === ds); },
  minutesOn(ds) { return Math.round(sum(this.on(ds).map(s => s.minutes))); },
  minutesRange(a, b) { return Math.round(sum(this.sessions().filter(s => s.date >= a && s.date <= b).map(s => s.minutes))); }
};
const Timer = {
  st: null, iv: null,
  load() { const s = DB.get('kv', 'timer'); this.st = s && s.mode ? s : null; if (this.st?.running) this.loop(); },
  persist() { return this.st ? DB.put('kv', { ...this.st, id: 'timer' }, { quiet: true }).catch(() => { }) : DB.del('kv', 'timer', { quiet: true }).catch(() => { }); },
  elapsed() { const s = this.st; if (!s) return 0; return s.acc + (s.running ? Date.now() - s.t0 : 0); },
  remaining() { return this.st ? Math.max(0, this.st.planned * 60000 - this.elapsed()) : 0; },
  pct() { return this.st ? clamp(this.elapsed() / (this.st.planned * 60000), 0, 1) : 0; },
  digits(ms = this.remaining()) { const s = Math.ceil(ms / 1000); const m = Math.floor(s / 60), r = s % 60; return `${F.num(Math.floor(m / 10))}${F.num(m % 10)}:${F.num(Math.floor(r / 10))}${F.num(r % 10)}`; },
  async start({ mode = 'focus', minutes, taskId = '', projectId = '', intention = '' } = {}) {
    const fp = S.prefs.focus; minutes = clamp(+minutes || (mode === 'focus' ? fp.work : mode === 'short' ? fp.short : fp.long), 1, 600);
    if (taskId && !projectId) projectId = Tasks.get(taskId)?.projectId || '';
    this.st = { mode, planned: minutes, acc: 0, t0: Date.now(), running: true, taskId, projectId, intention, startISO: nowISO(), cycle: this.st?.cycle || DB.get('kv', 'cycle')?.n || 0 };
    await this.persist(); this.loop(); App.schedule();
    if (taskId) { const tk = Tasks.get(taskId); if (tk && tk.status === 'todo') await Tasks.update(taskId, { status: 'doing' }); }
  },
  async pause() { if (!this.st?.running) return; this.st.acc += Date.now() - this.st.t0; this.st.running = false; clearInterval(this.iv); await this.persist(); App.schedule(); },
  async resume() { if (!this.st || this.st.running) return; this.st.t0 = Date.now(); this.st.running = true; await this.persist(); this.loop(); App.schedule(); },
  async reset() { clearInterval(this.iv); this.st = null; await this.persist(); document.title = 'ORION'; App.schedule(); FocusMode.close(); },

  tick() {

/* ---------- Goals & North Star ---------- */

  children(id) { return this.list().filter(g => g.parentId === id); },
  descendants(id, seen = new Set()) { if (seen.has(id)) return []; seen.add(id); return this.children(id).flatMap(c => [c.id, ...this.descendants(c.id, seen)]); },

  progress(g) {

  },
  nextStep(g) { const s = (g.steps || []).find(x => !x.done); if (s) return s.title; const tk = this.linkedTasks(g, true).filter(x => isOpenStatus(x.status)); return tk.length ? Tasks.smartSort(tk)[0].title : ''; },

};

const Journal = {
  list() { return sortBy(DB.all('journal_entries'), (a, b) => (b.date || '').localeCompare(a.date || ''), (a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')); },
  reviewOn(ds) { return DB.find('journal_entries', j => j.date === ds && j.type === 'evening'); },
  morningOn(ds) { return DB.find('journal_entries', j => j.date === ds && j.type === 'morning'); },
  questions(type) { const custom = S.prefs.journalTpl?.[type]; if (custom?.length) return custom; return (type === 'morning' ? [1, 2, 3] : [1, 2, 3, 4, 5]).map(i => t(`jq.${type}.${i}`)); },
  reviewStreakMax() { const ds = uniq(DB.filter('journal_entries', j => j.type === 'evening').map(j => j.date)).sort(); let best = 0, run = 0, prev = null; ds.forEach(d => { run = prev && D.diff(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }); return best; }
};

/* ---------- ORION Daily Score (transparent, weighted, capped per category) ---------- */
const Score = {
  day(ds) {
    const w = S.prefs.weights;
    const tasks = Tasks.forDay(ds).filter(x => x.status !== 'cancelled');
    const tw = sum(tasks.map(x => PRIO_W[x.priority] || 2)), tdn = sum(tasks.filter(x => x.status === 'done').map(x => PRIO_W[x.priority] || 2));
    const hs = Habits.list().filter(h => Habits.countsOn(h, ds));
    const fm = Focus.minutesOn(ds);
    const parts = {
      tasks: { v: tasks.length ? tdn / tw : null, w: +w.tasks, d: tasks.filter(x => x.status === 'done').length + '/' + tasks.length },
      habits: { v: hs.length ? avg(hs.map(h => Habits.weekly(h) ? (Habits.okOn(h, ds) ? 1 : 0) : Habits.prog(h, ds))) : null, w: +w.habits, d: hs.filter(h => Habits.okOn(h, ds)).length + '/' + hs.length },
      focus: { v: S.prefs.focusTarget > 0 ? clamp(fm / S.prefs.focusTarget, 0, 1) : null, w: +w.focus, d: F.dur(fm) + ' / ' + F.dur(S.prefs.focusTarget) },
      review: { v: Journal.reviewOn(ds) ? 1 : (Journal.morningOn(ds) ? .5 : 0), w: +w.review, d: Journal.reviewOn(ds) ? t('c.done') : t('c.notYet') }
    };
    const act = Object.values(parts).filter(p => p.v != null && p.w > 0); const W = sum(act.map(p => p.w));
    const total = W ? Math.round(sum(act.map(p => p.v * p.w)) / W * 100) : null;
    const hasData = tasks.length > 0 || hs.length > 0 || fm > 0 || parts.review.v > 0;
    return { total, parts, hasData };
  }
};

/* ---------- Next Best Action (explainable rules) ---------- */
const NBA = {
  rank(limit = 3) {
    const td = today(); const remain = Plan.remainingToday(); const ns = NS.taskSet(); const top = new Set(Plan.get(td).top3 || []);
    const c = Tasks.live().filter(x => isOpenStatus(x.status) && !Tasks.blockedBy(x).length);
    return c.map(x => {
      let s = { p1: 40, p2: 28, p3: 16, p4: 6 }[x.priority] || 10; const r = [];
      r.push({ k: 'nba.r.' + x.priority });
      if (x.due) { const dd = D.diff(td, x.due); if (dd < 0) { s += 30; r.push({ k: 'nba.r.overdue', n: -dd }); } else if (dd === 0) { s += 22; r.push({ k: 'nba.r.today' }); } else if (dd === 1) { s += 12; r.push({ k: 'nba.r.tomorrow' }); } else if (dd <= 3) { s += 6; r.push({ k: 'nba.r.soon', n: dd }); } }
      const du = Tasks.dur(x); if (du) { if (du <= remain) { s += 8; r.push({ k: 'nba.r.fits', m: F.dur(du) }); } else { s -= 10; r.push({ k: 'nba.r.long', m: F.dur(du) }); } }
      const ub = Tasks.unblocks(x); if (ub) { s += 5 * ub; r.push({ k: 'nba.r.unblocks', n: ub }); }
      if (x.status === 'doing') { s += 6; r.push({ k: 'nba.r.doing' }); }
      if (ns.has(x.id)) { s += 8; r.push({ k: 'nba.r.ns' }); }
      if (top.has(x.id)) { s += 15; r.push({ k: 'nba.r.top3' }); }
      return { task: x, score: s, reasons: r };
    }).sort((a, b) => b.score - a.score).slice(0, limit);
  },
  reasonText(r) { return t(r.k, { n: r.n, m: r.m }); }
};

/* ---------- ORION Daily Brief (4 questions, rule-based) ---------- */
const Brief = {
  build() {
    const td = today(), now = D.nowMin(); const plan = Plan.get(td);
    const top = (plan.top3 || []).map(id => Tasks.get(id)).filter(x => x && isOpenStatus(x.status));
    const nba = S.prefs.smartEnabled ? NBA.rank(1)[0] : null;
    const q1 = top[0] || nba?.task || null;
    // nearest important appointment (next 7 days)
    const cands = [];
    for (let i = 0; i < 7; i++) { const d = D.add(td, i); Cal.items(d).forEach(it => { if (it.kind === 'rest' || it.done) return; if (it.kind === 'task' && !it.start) return; const m = D.toMin(it.start) ?? 0; if (i === 0 && it.start && m < now) return; if (i === 0 && !it.start && (it.kind === 'event' || it.kind === 'block')) return; cands.push({ d, m, it }); }); if (cands.length) break; }
    const q2 = cands.sort((a, b) => a.d.localeCompare(b.d) || a.m - b.m)[0] || null;
    // habit needing attention
    const hs = Habits.list(); const missed = hs.map(h => ({ h, d: Habits.missed(h) })).find(x => x.d);
    const pend = hs.filter(h => Habits.countsOn(h, td) && !Habits.okOn(h, td)).map(h => ({ h, r: Habits.stats(h).w30 ?? 1 })).sort((a, b) => a.r - b.r)[0];
    const q3 = missed ? { h: missed.h, missed: true } : pend ? { h: pend.h } : null;
    // best next step
    let q4;
    const revT = D.toMin(S.prefs.reminders.dailyReview.time) ?? 1200;
    if (Timer.st) q4 = { k: 'brief.n.session', act: 'go', to: 'focus' };
    else if (!plan.planned && now < 14 * 60 && Tasks.live().some(x => isOpenStatus(x.status))) q4 = { k: 'brief.n.plan', act: 'go', to: 'myday' };
    else if (now >= revT && !Journal.reviewOn(td)) q4 = { k: 'brief.n.review', act: 'go', to: 'journal', params: { new: 'evening' } };
    else if (q1) q4 = { k: 'brief.n.focus', v: q1.title, act: 'focusTask', id: q1.id };
    else if (!Tasks.live().length) q4 = { k: 'brief.n.first', act: 'newTask' };
    else q4 = { k: 'brief.n.rest' };
    return { q1, q2, q3, q4 };
  }
};

/* ---------- Points (meaningful actions, daily cap, no penalties) ---------- */
const Points = {
  todayTotal() { const td = today(); return sum(DB.filter('points_log', p => p.date === td).map(p => p.pts)); },
  total() { return sum(DB.all('points_log').map(p => p.pts)); },
  async award(key, pts, reason) {
    if (DB.get('points_log', key)) return 0;
    const rem = Math.max(0, (S.prefs.pointsCap || 120) - this.todayTotal()); const p = Math.min(pts, rem);
    await DB.put('points_log', { id: key, date: today(), pts: p, reason, capped: p < pts }, { quiet: true }).catch(() => { });
    return p;
  },
  level() { const tot = this.total(); const lvl = Math.floor(Math.sqrt(tot / 60)) + 1; const a = 60 * (lvl - 1) ** 2, b = 60 * lvl ** 2; return { lvl, tot, pct: (tot - a) / (b - a), next: b - tot }; }
};

/* ---------- Achievements (from the source: 6 milestones) ---------- */
const ACH = [
  { id: 'first_plan', icon: 'sun', grad: 'gBlue', check: () => DB.all('day_plans').some(p => p.planned), prog: () => [DB.all('day_plans').some(p => p.planned) ? 1 : 0, 1] },
  { id: 'tasks10', icon: 'tasks', grad: 'gViolet', prog: () => [Tasks.all().filter(x => x.status === 'done').length, 10] },
  { id: 'focus10', icon: 'target', grad: 'gPink', prog: () => [Focus.sessions().filter(s => s.completed).length, 10] },
  { id: 'habit_week', icon: 'repeat', grad: 'gGreen', prog: () => [Habits.list().concat(DB.filter('habits', h => h.archived)).some(h => Ach.habitWeek(h)) ? 1 : 0, 1] },
  { id: 'project_done', icon: 'folder', grad: 'gBlue', prog: () => [Projects.list().some(p => p.status === 'done') ? 1 : 0, 1] },
  { id: 'review7', icon: 'journal', grad: 'gViolet', prog: () => [Math.min(7, Journal.reviewStreakMax()), 7] }];
const Ach = {
  habitWeek(h) { const td = today(); for (let k = 0; k < 12; k++) { const ws = D.add(D.weekStart(td), -7 * k); if (Habits.weekly(h)) { if (Habits.weekDone(h, ws) >= Habits.perWeek(h)) return true; continue; } const days = D.range(ws, 7).filter(d => d <= td && Habits.scheduled(h, d)); if (days.length >= 3 && D.add(ws, 6) <= td && days.every(d => Habits.doneOn(h, d))) return true; } return false; },
  unlocked(id) { return DB.get('user_achievements', id); },
  async evaluate() {
    for (const a of ACH) {
      if (this.unlocked(a.id)) continue;
      const [v, n] = a.prog(); if (v < n) continue;
      await DB.put('user_achievements', { id: a.id, at: nowISO() }, { quiet: true });
      await Points.award('ach:' + a.id, 25, 'pts.ach');
      await Notify.push({ type: 'achievement', key: 'notif.ach', params: { name: '@ach.' + a.id + '.t' }, link: 'achievements', silent: true });
      FX.big(t('ach.unlocked', { name: t('ach.' + a.id + '.t') }));
    }
  }
};

/* ---------- Challenges ---------- */
const CHALLENGES = [{ id: 'c7', days: 7, icon: 'zap' }, { id: 'c30', days: 30, icon: 'mountain' }, { id: 'read', days: 14, icon: 'book', auto: 'reading' }, { id: 'nodistract', days: 7, icon: 'phone' }, { id: 'plan', days: 7, icon: 'sun', auto: 'plan' }];
const Challenges = {
  def(cid) { return CHALLENGES.find(c => c.id === cid) || DB.get('challenges', cid); },
  title(p) { const d = this.def(p.cid); return p.title || (d && !d.title ? t('ch.' + p.cid + '.t') : d?.title) || ''; },
  autoDays(p) { const d = this.def(p.cid); if (!d?.auto) return []; const days = D.between(p.startDate, today()); if (d.auto === 'plan') return days.filter(x => Plan.get(x).planned); if (d.auto === 'reading') { const books = new Set(DB.filter('learning_items', i => i.kind === 'book').map(i => i.id)); return days.filter(x => DB.find('learning_sessions', s => s.date === x && books.has(s.itemId))); } return []; },
  days(p) { return uniq([...(p.checkins || []), ...this.autoDays(p)]).filter(d => d >= p.startDate).sort(); },
  async checkComplete(p) { const n = this.days(p).length; if (p.status === 'active' && n >= p.days) { await DB.put('challenge_progress', { ...p, status: 'completed', completedAt: nowISO() }); await Points.award('ch:' + p.id, 30, 'pts.challenge'); FX.big(t('ch.completedToast', { name: this.title(p) })); } }
};

/* ---------- Notifications & reminders (in-app only, while ORION is open) ---------- */
const Notify = {
  resolve(params = {}) { const o = {}; for (const k in params) { const v = params[k]; o[k] = typeof v === 'string' && v.startsWith('@') ? t(v.slice(1)) : v; } return o; },
  text(n) { return t(n.key, this.resolve(n.params)); },
  async push({ type, key, params = {}, link = '', dedupe = '', silent = false }) {
    if (dedupe && S.prefs.fired?.[dedupe]) return;
    await DB.put('notifications', { id: uid(), type, key, params, link, read: false, at: nowISO() });
    if (dedupe) await setPrefs({ fired: { ...pruneFired(S.prefs.fired), [dedupe]: today() } }, { quiet: true });
    if (!silent) toast(t(key, this.resolve(params)), 'info', { title: t('notif.type.' + type), timeout: 7000 });
  }
};
function pruneFired(f = {}) { const lim = D.add(today(), -10); const o = {}; for (const k in f) if (f[k] >= lim) o[k] = f[k]; return o; }
const Reminders = {
  inQuiet() { const q = S.prefs.reminders.quiet; if (!q?.on) return false; const n = D.nowMin(), a = D.toMin(q.from), b = D.toMin(q.to); return a <= b ? (n >= a && n < b) : (n >= a || n < b); },
  async check() {
    if (!S.prefs.onboarded || this.inQuiet()) return;
    const R = S.prefs.reminders, td = today(), now = D.nowMin();
    if (R.task.on) for (const x of Tasks.live().filter(x => x.due === td && x.start && isOpenStatus(x.status))) { const d = D.toMin(x.start) - now; if (d >= 0 && d <= (+R.task.lead || 15)) await Notify.push({ type: 'task', key: 'notif.task', params: { title: x.title, time: F.time(x.start) }, link: 'tasks', dedupe: `task:${x.id}:${td}` }); }
    if (R.dailyReview.on && now >= D.toMin(R.dailyReview.time) && !Journal.reviewOn(td)) await Notify.push({ type: 'review', key: 'notif.review', link: 'journal', dedupe: `review:${td}` });
    if (R.weeklyReview.on && D.dow(td) === +R.weeklyReview.day && now >= D.toMin(R.weeklyReview.time) && !DB.get('weekly_resets', D.weekStart(td))?.completedAt) await Notify.push({ type: 'weekly', key: 'notif.weekly', link: 'reset', dedupe: `weekly:${D.weekStart(td)}` });
    if (R.habit.on) for (const h of Habits.list().filter(h => h.reminder && Habits.countsOn(h, td) && !Habits.okOn(h, td))) { const m = D.toMin(h.reminder); if (now >= m && now - m < 180) await Notify.push({ type: 'habit', key: 'notif.habit', params: { name: h.name }, link: 'habits', dedupe: `habit:${h.id}:${td}` }); }
    if (R.focus.on && now >= D.toMin(R.focus.time) && !Focus.on(td).length && !Timer.st) await Notify.push({ type: 'focus', key: 'notif.focus', link: 'focus', dedupe: `focus:${td}` });
    if (R.goal.on) for (const g of Goals.active().filter(g => g.targetDate && g.targetDate >= td && D.diff(td, g.targetDate) <= 3)) await Notify.push({ type: 'goal', key: 'notif.goal', params: { name: g.title, n: D.diff(td, g.targetDate) }, link: 'goals', dedupe: `goal:${g.id}:${td}` });
    if (R.milestone.on) for (const p of Projects.list().filter(p => p.status === 'active' || p.status === 'planning')) for (const m of (p.milestones || []).filter(m => !m.done && m.due && m.due >= td && D.diff(td, m.due) <= 1)) await Notify.push({ type: 'milestone', key: 'notif.ms', params: { name: m.title, project: p.name }, link: 'projects', dedupe: `ms:${p.id}:${m.id}:${td}` });
    for (const p of Projects.list().filter(p => Projects.stale(p))) await Notify.push({ type: 'project', key: 'notif.stale', params: { name: p.name, n: Projects.idleDays(p) }, link: 'projects', dedupe: `stale:${p.id}:${td}` });
    for (const d of DB.filter('decisions', d => d.reviewDate && d.reviewDate <= td && !d.reviewed)) await Notify.push({ type: 'decision', key: 'notif.decision', params: { name: d.title }, link: 'journal', dedupe: `dec:${d.id}` });
  }
};

/* ---------- Visual feedback ---------- */
const FX = {
  taskDone(x, pts) { $$(`[data-task="${x.id}"]`).forEach(el => { el.classList.remove('just-done'); void el.offsetWidth; el.classList.add('just-done'); }); toast(pts ? t('task.doneToastPts', { n: pts }) : t('task.doneToast'), 'ok'); if (x.priority === 'p1') celebrate(false); },
  small(msg) { toast(msg, 'ok'); },
  big(msg) { toast(msg, 'cele', { title: t('fx.congrats'), timeout: 6000 }); celebrate(true); chime(); }
};

/* ---------- Built-in Personal Templates (translatable until edited by the user) ---------- */
const BUILTIN_TPL = [
  { id: 'tpl_morning', kind: 'checklist', icon: 'sun', n: 5 },
  { id: 'tpl_deep', kind: 'blocks', icon: 'target', blocks: [['08:00', '08:30'], ['08:30', '10:00'], ['10:00', '10:15'], ['10:15', '12:00'], ['12:00', '13:00'], ['13:00', '14:00'], ['14:00', '16:00'], ['16:00', '16:15']] },
  { id: 'tpl_eod', kind: 'journal', icon: 'moon', n: 5 },
  { id: 'tpl_week', kind: 'checklist', icon: 'calendar', n: 6 },
  { id: 'tpl_launch', kind: 'project', icon: 'folder', n: 6 },
  { id: 'tpl_skill', kind: 'skill', icon: 'grad', n: 5 },
  { id: 'tpl_sleep', kind: 'checklist', icon: 'moon', n: 5 }];
const Templates = {
  resolve(id) {
    const own = DB.get('templates', id); if (own) return { ...own, builtin: !!BUILTIN_TPL.find(b => b.id === id), edited: true };
    const b = BUILTIN_TPL.find(x => x.id === id); if (!b) return null;
    const items = b.kind === 'blocks' ? b.blocks.map((bl, i) => ({ s: bl[0], e: bl[1], title: t(`${b.id}.${i + 1}`) })) : Array.from({ length: b.n }, (_, i) => t(`${b.id}.${i + 1}`));
    return { id: b.id, kind: b.kind, icon: b.icon, name: t(b.id + '.name'), desc: t(b.id + '.desc'), items, builtin: true, edited: false };
  },
  list() { return [...BUILTIN_TPL.map(b => this.resolve(b.id)), ...DB.filter('templates', x => !BUILTIN_TPL.find(b => b.id === x.id)).map(x => this.resolve(x.id))]; }
};
</script>

<script>
'use strict';
/* =====================================================================
   VIEWS (A): shared components · HOME · MY DAY · TASKS · CALENDAR
   ===================================================================== */

/* ---------- Shared components ---------- */
function viewHead(code, title, sub, actions = '') {
  return `<div class="view-head"><div class="titles">${code ? `<div class="code-name">${esc(code)}</div>` : ''}<h1>${esc(title)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div><div class="row wrap">${actions}</div></div>`;
}
function emptyArt() {
  return `<svg class="art" viewBox="0 0 120 90" aria-hidden="true"><ellipse cx="60" cy="48" rx="50" ry="18" fill="none" stroke="url(#gBrand)" stroke-width="1.4" opacity=".7" transform="rotate(-14 60 48)"/><circle cx="60" cy="46" r="16" fill="url(#gCore)"/><circle cx="104" cy="34" r="4" fill="#F472B6"/><circle cx="18" cy="60" r="2.5" fill="#38BDF8"/><circle cx="30" cy="16" r="1.5" fill="#A78BFA" class="twinkle"/><circle cx="92" cy="76" r="1.5" fill="#7DD3FC" class="twinkle" style="animation-delay:1.2s"/></svg>`;
}
function emptyState({ title, text = '', action = '', small = false }) {
  return `<div class="empty"${small ? ' style="padding:20px 10px"' : ''}>${small ? '' : emptyArt()}<h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${action}</div>`;
}
const tick = (checked, act, id, label, extra = '') => `<button class="tick${extra}" role="checkbox" aria-checked="${!!checked}" data-act="${act}" data-id="${id}" aria-label="${esc(label)}"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg></button>`;
const prioChip = p => `<span class="chip ${{ p1: 'p', p2: 'v', p3: 'b', p4: '' }[p]}"><span class="prio ${p}"></span>${esc(t('prio.' + p))}</span>`;
const statusChip = s => `<span class="chip ${{ todo: '', doing: 'b', done: 'g', postponed: 'w', cancelled: 'r' }[s]}">${esc(t('status.' + s))}</span>`;
function bar(pct, cls = '') { return `<div class="bar ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct * 100)}"><i style="width:${clamp(pct, 0, 1) * 100}%"></i></div>`; }

function taskRow(x, o = {}) {
  const done = x.status === 'done', od = Tasks.overdue(x), blk = Tasks.blockedBy(x).length;
  const pr = DB.get('projects', x.projectId); const subs = x.subtasks || [];
  const meta = [
    o.hideDue || !x.due ? '' : `<span class="${od ? 'chip r' : ''}">${icon('calendar', 'sm')} ${esc(F.rel(x.due))}${x.start ? ' · ' + esc(F.time(x.start)) : ''}</span>`,
    x.status !== 'todo' && x.status !== 'done' ? statusChip(x.status) : '',
    pr ? `<span>${icon('folder', 'sm')} <span class="ucontent">${esc(pr.name)}</span></span>` : '',
    Tasks.dur(x) ? `<span>${icon('clock', 'sm')} ${esc(F.dur(Tasks.dur(x)))}</span>` : '',
    subs.length ? `<span>${icon('check', 'sm')} ${F.num(subs.filter(s => s.done).length)}/${F.num(subs.length)}</span>` : '',
    x.recur?.freq && x.recur.freq !== 'none' ? `<span title="${esc(t('recur.' + x.recur.freq))}">${icon('repeat', 'sm')}</span>` : '',
    blk ? `<span class="chip w">${icon('ban', 'sm')} ${esc(t('task.blocked'))}</span>` : '',
    ...(x.tags || []).slice(0, 3).map(tg => `<span class="chip v ucontent">#${esc(tg)}</span>`)
  ].filter(Boolean).join('');
  const selected = S.ui.sel?.has(x.id);
  return `<div class="item ${done ? 'done' : ''} ${od ? 'overdue' : ''} ${selected ? 'selected' : ''}" data-task="${x.id}" ${o.drag ? `data-drag="task:${x.id}"` : ''} tabindex="-1">
    ${o.drag ? `<button class="drag-handle" data-handle data-kb-move="${x.id}" aria-label="${esc(t('task.reorderHint'))}" title="${esc(t('task.reorderHint'))}">${icon('grip', 'sm')}</button>` : ''}
    ${o.select ? `<input type="checkbox" data-change="selTask" data-id="${x.id}" aria-label="${esc(t('c.select'))}"${chk(selected)}>` : ''}
    ${tick(done, 'toggleTask', x.id, t('task.toggle', { title: x.title }), ' round')}
    <span class="prio ${x.priority}" title="${esc(t('prio.' + x.priority))}"></span>
    <div class="grow" style="cursor:pointer" data-act="editTask" data-id="${x.id}"><div class="item-title ucontent">${esc(x.title)}</div>${meta ? `<div class="item-meta">${meta}</div>` : ''}</div>
    <div class="actions">${!done ? `<button class="btn sm ghost icon" data-act="focusTask" data-id="${x.id}" aria-label="${esc(t('focus.startOn', { title: x.title }))}" title="${esc(t('focus.start'))}">${icon('play', 'sm')}</button>` : ''}<button class="btn sm ghost icon" data-act="taskMenu" data-id="${x.id}" aria-label="${esc(t('c.moreActions'))}" aria-haspopup="menu">${icon('more', 'sm')}</button></div>
  </div>`;
}

/* ---------- Task form (create / edit) ---------- */
const TaskForm = {
  open(id = null, defaults = {}) {
    const x = id ? Tasks.get(id) || DB.get('tasks', id) : { ...Tasks.blank(), ...defaults };
    if (!x) return;
    S.ui.taskDraftSubs = JSON.parse(JSON.stringify(x.subtasks || []));
    const others = Tasks.live().filter(y => y.id !== id && isOpenStatus(y.status));
    const ms = x.projectId ? (DB.get('projects', x.projectId)?.milestones || []) : [];

function orbitSVG({ tasks, habits, focus, center, centerSub }) {

  return `<svg class="orbit-svg" viewBox="0 0 300 300" role="img" aria-label="${esc(t('home.orbitAria', { a: F.pct(tasks || 0), b: F.pct(habits || 0), c: F.pct(focus || 0) }))}">

function constellationSVG() {
  const st = [[300, 60], [455, 72], [380, 30], [395, 160], [425, 152], [455, 145], [345, 255], [490, 245]];
  const ln = [[2, 0], [2, 1], [0, 3], [1, 5], [3, 4], [4, 5], [3, 6], [5, 7]];

}
function todayMetrics() {
  const td = today(); const ts = Tasks.forDay(td).filter(x => x.status !== 'cancelled');
  const done = ts.filter(x => x.status === 'done').length;

}

/* ---------- Time grid (shared by My Day & Calendar) ---------- */
const PX_PER_MIN = 0.8;
function gridHours() { const s = Math.floor((D.toMin(S.prefs.dayStart) ?? 480) / 60); return [Math.max(0, Math.min(6, s - 1)), 24]; }
function timeGrid(days) {
  const [h0, h1] = gridHours(); const td = today(); const now = D.nowMin();
  const hours = Array.from({ length: h1 - h0 }, (_, i) => h0 + i);
  const col = ds => {
    const items = Cal.items(ds).filter(i => i.start && i.end && D.toMin(i.end) > D.toMin(i.start));
    const slots = hours.flatMap(h => [0, 30].map(mm => `<div class="tg-slot" data-drop="slot:${ds}|${h * 60 + mm}" data-act="slotClick" data-d="${ds}" data-m="${h * 60 + mm}" role="button" tabindex="-1" aria-label="${esc(F.minTime(h * 60 + mm))}"></div>`)).join('');
    const blocks = items.map(i => { const s = Math.max(D.toMin(i.start), h0 * 60), e = Math.min(D.toMin(i.end), h1 * 60); return `<button class="tg-block ${i.kind === 'task' ? 'task' : i.kind === 'rest' ? 'rest' : ''} ${i.done ? 'done' : ''}" style="top:${(s - h0 * 60) * PX_PER_MIN}px;height:${Math.max(18, (e - s) * PX_PER_MIN - 2)}px" data-act="${i.kind === 'task' ? 'editTask' : 'editEvent'}" data-id="${i.id}" ${i.kind === 'task' ? `data-drag="task:${i.id}"` : ''}><b class="ucontent">${i.kind === 'task' ? `<span data-handle style="cursor:grab">⠿ </span>` : ''}${esc(i.title)}</b><span>${esc(F.time(i.start))}–${esc(F.time(i.end))}</span></button>`; }).join('');
    const nl = ds === td && now >= h0 * 60 && now < h1 * 60 ? `<div class="now-line" style="top:${(now - h0 * 60) * PX_PER_MIN}px" aria-hidden="true"></div>` : '';
    return `<div class="tg-col">${slots}${blocks}${nl}</div>`;
  };
  const heads = days.length > 1 ? `<div class="tg-head" style="border-inline-start:0"></div>${days.map(d => `<div class="tg-head ${d === td ? 'today' : ''}">${esc(F.date(d, 'wd'))}<br><span class="num">${esc(F.date(d, 'dnum'))}</span></div>`).join('')}` : '';
  return `<div class="timegrid" style="--cols:${days.length}">${heads}<div>${hours.map(h => `<div class="tg-hour">${esc(F.minTime(h * 60))}</div>`).join('')}</div>${days.map(col).join('')}</div>`;
}
A.slotClick = el => EventForm.open(null, { date: el.dataset.d, start: D.fromMin(+el.dataset.m), end: D.fromMin(+el.dataset.m + 60) });
Drag.on.task = async (id, zk, zv, zone, beforeId) => {
  const x = Tasks.get(id); if (!x) return;
  if (zk === 'slot') { const [ds, m] = zv.split('|'); const s = +m; const dur = Tasks.dur(x) || 30; await Tasks.update(id, { due: ds, start: D.fromMin(s), end: D.fromMin(Math.min(s + dur, 1439)) }); await Plan.save(ds, { blocks: true }); toast(t('tb.scheduled', { t: F.minTime(s) }), 'ok'); }
  else if (zk === 'unsched') await Tasks.update(id, { start: '', end: '' });
  else if (zk === 'status') await Tasks.setStatus(id, zv);
  else if (zk === 'quad') await Tasks.update(id, { priority: zv });
  else if (zk === 'day') await Tasks.update(id, { due: zv });
  else if (zk === 'proj') await Tasks.update(id, { projectId: zv === '_' ? '' : zv });
  else if (zk === 'prio') await Tasks.update(id, { priority: zv });
  else if (zk === 'list') await reorderTask(id, beforeId);
};
async function reorderTask(id, beforeId) {
  const ids = S.ui.visibleTaskIds || []; const arr = ids.filter(x => x !== id);
  const idx = beforeId ? arr.indexOf(beforeId) : arr.length; arr.splice(idx < 0 ? arr.length : idx, 0, id);
  await DB.putMany('tasks', arr.map((tid, i) => ({ ...DB.get('tasks', tid), order: i })).filter(x => x.id));
}
// Keyboard alternative for drag: Alt+ArrowUp/Down on a task's handle moves it in the list; Alt+Left/Right moves kanban status
document.addEventListener('keydown', async e => {
  const h = e.target.closest?.('[data-kb-move]'); if (!h || !e.altKey) return;
  const id = h.dataset.kbMove; const ids = S.ui.visibleTaskIds || []; const i = ids.indexOf(id);
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault(); const j = e.key === 'ArrowUp' ? i - 1 : i + 1; if (i < 0 || j < 0 || j >= ids.length) return;
    const arr = [...ids]; [arr[i], arr[j]] = [arr[j], arr[i]];
    await DB.putMany('tasks', arr.map((tid, k) => ({ ...DB.get('tasks', tid), order: k })));
    requestAnimationFrame(() => $(`[data-kb-move="${id}"]`)?.focus()); toast(t('task.moved'), 'info', { timeout: 1200 });
  } else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && S.ui.taskView === 'kanban') {
    e.preventDefault(); const x = Tasks.get(id); const order = ['todo', 'doing', 'postponed', 'done']; let k = order.indexOf(x.status); k = clamp(k + ((e.key === 'ArrowRight') !== isRTL() ? 1 : -1), 0, order.length - 1);
    await Tasks.setStatus(id, order[k]); requestAnimationFrame(() => $(`[data-kb-move="${id}"]`)?.focus());
  }
});

  },
  allDayRow(days) {
    return `<div class="timegrid" style="--cols:${days.length};margin-bottom:8px"><div class="tg-hour" style="height:auto;display:grid;place-items:center">${esc(t('ev.allDay'))}</div>${days.map(d => { const its = Cal.items(d).filter(i => !i.start || !i.end); return `<div class="tg-col" style="padding:4px;display:flex;flex-direction:column;gap:3px;min-height:40px" data-drop="day:${d}">${Cal.isRest(d) ? `<div class="ev rest">${esc(t('cal.restDay'))}</div>` : ''}${its.filter(i => i.kind !== 'rest').slice(0, 4).map(i => `<button class="ev ${i.kind}" style="border:0;text-align:start;cursor:pointer" data-act="${i.kind === 'task' ? 'editTask' : i.kind === 'event' || i.kind === 'block' ? 'editEvent' : i.kind === 'goal' ? 'openGoal' : 'openProject'}" data-id="${i.id}" ${i.kind === 'task' ? `data-drag="task:${i.id}"` : ''}>${i.kind === 'task' ? '<span data-handle>⠿ </span>' : ''}${esc(i.title)}</button>`).join('')}${its.length > 4 ? `<span class="xs muted">+${F.num(its.length - 4)}</span>` : ''}</div>`; }).join('')}</div>`;
  },
  month(ds) {
    const ms = D.monthStart(ds), me = D.monthEnd(ds); const gs = D.weekStart(ms); const n = Math.ceil((D.diff(gs, me) + 1) / 7) * 7; const td = today();
    const hij = S.prefs.calendar === 'islamic-umalqura';
    return `<div class="month" role="grid" aria-label="${esc(F.date(ds, 'month'))}">${D.weekdays().map(w => `<div class="dow" role="columnheader">${esc(D.wdName(w))}</div>`).join('')}
      ${D.range(gs, n).map(d => { const its = Cal.items(d).filter(i => i.kind !== 'rest'); return `<button class="mday ${d < ms || d > me ? 'out' : ''} ${d === td ? 'today' : ''} ${Cal.isRest(d) ? 'rest' : ''}" data-act="calDay" data-d="${d}" data-drop="day:${d}" aria-label="${esc(F.date(d, 'full'))}${its.length ? ' · ' + esc(t('cal.nItems', { n: its.length })) : ''}"><span class="dnum"><span class="num">${esc(F.date(d, 'dnum', true))}</span>${hij ? `<span class="hij">${esc(F.hijriDay(d))}</span>` : ''}</span>${its.slice(0, 3).map(i => `<span class="ev ${i.kind} ucontent">${i.start ? esc(F.time(i.start)) + ' ' : ''}${esc(i.title)}</span>`).join('')}${its.length > 3 ? `<span class="xs muted">+${F.num(its.length - 3)}</span>` : ''}<span class="evdot" style="gap:3px;flex-wrap:wrap">${its.slice(0, 4).map(i => `<i class="ev ${i.kind}" style="width:6px;height:6px;padding:0;border-radius:50%;border:0"></i>`).join('')}</span></button>`; }).join('')}</div>`;
  },
  dayPanel(ds) {
    const its = Cal.items(ds);
    return `<section class="card tight"><div class="card-h"><h3>${esc(F.date(ds, 'med'))}</h3><button class="btn sm ${Cal.isRest(ds) ? 'primary' : ''}" data-act="toggleRest" data-date="${ds}" aria-pressed="${Cal.isRest(ds)}">${icon('coffee', 'sm')}${esc(t('cal.restDay'))}</button></div>
      ${its.length ? `<div class="list">${its.map(i => `<div class="item"><span class="ev ${i.kind}" style="width:5px;height:28px;padding:0"></span><div class="grow" style="cursor:pointer" data-act="${i.kind === 'task' ? 'editTask' : i.kind === 'event' || i.kind === 'block' || i.kind === 'rest' ? 'editEvent' : i.kind === 'goal' ? 'openGoal' : 'openProject'}" data-id="${i.id}" data-date="${ds}"><div class="item-title ucontent small ${i.done ? 'muted' : ''}">${esc(i.title)}</div><div class="item-meta">${esc(t('calk.' + i.kind))}${i.start ? ' · ' + esc(F.time(i.start)) + '–' + esc(F.time(i.end)) : ''}${i.ref?.recur && i.ref.recur !== 'none' && (i.kind === 'event' || i.kind === 'block') ? ' · ' + esc(t('recur.' + i.ref.recur)) : ''}</div></div></div>`).join('')}</div>` : `<p class="small muted">${esc(t('cal.empty'))}</p>`}
      <div class="row wrap" style="margin-top:12px"><button class="btn sm" data-act="newTask" data-due="${ds}">${icon('plus', 'sm')}${esc(t('task.new'))}</button><button class="btn sm" data-act="go" data-to="myday" data-params='{"date":"${ds}"}'>${icon('sun', 'sm')}${esc(t('nav.myday'))}</button></div></section>`;
  },
  agenda(ds) {
    const days = D.range(ds, 30).map(d => [d, Cal.items(d).filter(i => i.kind !== 'rest' || true)]).filter(([, its]) => its.length);
    return days.length ? `<section class="card">${days.map(([d, its]) => `<div class="agenda-day"><div><b>${esc(F.date(d, 'med'))}</b>${d === today() ? `<div><span class="chip v">${esc(t('d.today'))}</span></div>` : ''}</div><div class="list">${its.map(i => `<div class="item" style="cursor:pointer" data-act="${i.kind === 'task' ? 'editTask' : i.kind === 'event' || i.kind === 'block' || i.kind === 'rest' ? 'editEvent' : i.kind === 'goal' ? 'openGoal' : 'openProject'}" data-id="${i.id}" data-date="${d}"><span class="ev ${i.kind}" style="width:5px;height:28px;padding:0"></span><div class="grow"><div class="item-title ucontent small">${esc(i.title)}</div><div class="item-meta">${esc(t('calk.' + i.kind))}${i.start ? ' · ' + esc(F.time(i.start)) + '–' + esc(F.time(i.end)) : ''}</div></div></div>`).join('')}</div></div>`).join('')}</section>` : emptyState({ title: t('cal.agendaEmpty'), action: `<button class="btn" data-act="newEvent" data-date="${ds}">${icon('plus', 'sm')}${esc(t('ev.new'))}</button>` });
  }
};
A.calNav = el => setParam('date', el.dataset.d);
A.calDay = el => go('calendar', { view: 'day', date: el.dataset.d });
</script>

<script>
'use strict';
/* =====================================================================
   VIEWS (B): HABITS · FOCUS (+ Focus Mode) · GOALS · PROJECTS · JOURNAL
   ===================================================================== */

/* ---------- HABIT ENGINE ---------- */
const HabitForm = {
  open(id = null, d = {}) {
    const h = id ? DB.get('habits', id) : { name: d.name || '', desc: '', icon: 'star', color: '#8B5CF6', type: 'daily', days: [], times: 3, target: 1, unit: '', reminder: '', notes: '', startDate: today(), areaId: '', stackAfter: '', stackCue: '', backupPlan: '' };
    if (!h) return;
    const others = Habits.list().filter(x => x.id !== id);
    const colors = ['#8B5CF6', '#38BDF8', '#F472B6', '#34D399', '#FBBF24', '#A78BFA', '#7DD3FC', '#FB7185'];
    Modal.open({
      title: esc(id ? t('habit.edit') : t('habit.new')), size: 'lg',
      body: `<form data-form="habitSave" id="habitForm" data-id="${id || ''}" class="form-grid" novalidate>
        <label class="field full"><span>${esc(t('habit.f.name'))} *</span><input class="input" name="name" value="${esc(h.name)}" maxlength="120" required autofocus dir="auto" placeholder="${esc(t('habit.f.namePh'))}"></label>
        <label class="field full"><span>${esc(t('habit.f.desc'))}</span><input class="input" name="desc" value="${esc(h.desc)}" maxlength="300" dir="auto"></label>
        <fieldset class="field full" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:6px">${esc(t('habit.f.icon'))}</legend><div class="row wrap">${HABIT_ICONS.map(ic => `<label class="pick" style="min-height:40px;padding:8px;width:auto"><input type="radio" name="icon" value="${ic}"${chk(h.icon === ic)} class="sr-only">${icon(ic)}<span class="sr-only">${ic}</span></label>`).join('')}</div></fieldset>
        <fieldset class="field full" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:6px">${esc(t('habit.f.color'))}</legend><div class="row wrap">${colors.map(c => `<label style="cursor:pointer"><input type="radio" name="color" value="${c}"${chk(h.color === c)} class="sr-only"><span style="display:block;width:30px;height:30px;border-radius:9px;background:${c};border:2px solid ${h.color === c ? '#fff' : 'transparent'}" aria-label="${c}"></span></label>`).join('')}</div></fieldset>
        <label class="field"><span>${esc(t('habit.f.type'))}</span><select class="select" name="type" data-change="habitTypeChange">${HABIT_TYPES.map(x => `<option value="${x}"${sel(h.type, x)}>${esc(t('habit.type.' + x))}</option>`).join('')}</select></label>
        <label class="field"><span>${esc(t('habit.f.start'))}</span><input class="input" type="date" name="startDate" value="${esc(h.startDate || today())}"></label>
        <fieldset class="field full" id="hfDays" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:6px">${esc(t('habit.f.days'))}</legend><div class="row wrap">${D.weekdays().map(w => `<label class="check" style="min-height:auto"><input type="checkbox" name="days" value="${w}"${chk((h.days || []).includes(w))}>${esc(D.wdName(w))}</label>`).join('')}</div><span class="hint">${esc(t('habit.f.daysHint'))}</span></fieldset>
        <label class="field" id="hfTimes"><span>${esc(t('habit.f.times'))}</span><input class="input" type="number" min="1" max="7" name="times" value="${h.times || 3}"></label>
        <label class="field" id="hfTarget"><span>${esc(t('habit.f.target'))}</span><input class="input" type="number" min="0.1" step="any" max="100000" name="target" value="${h.target || 1}"></label>
        <label class="field" id="hfUnit"><span>${esc(t('habit.f.unit'))}</span><input class="input" name="unit" value="${esc(h.unit)}" maxlength="20" placeholder="${esc(t('habit.f.unitPh'))}" dir="auto"></label>
        <label class="field"><span>${esc(t('habit.f.reminder'))}</span><input class="input" type="time" name="reminder" value="${esc(h.reminder)}"><span class="hint">${esc(t('habit.f.reminderHint'))}</span></label>
        <label class="field"><span>${esc(t('task.f.area'))}</span><select class="select" name="areaId">${Areas.options(h.areaId)}</select></label>
        <label class="field"><span>${esc(t('habit.f.stackAfter'))}</span><select class="select" name="stackAfter"><option value="">${esc(t('c.none'))}</option>${others.map(o => `<option value="${o.id}"${sel(h.stackAfter, o.id)}>${esc(o.name)}</option>`).join('')}</select></label>
        <label class="field"><span>${esc(t('habit.f.cue'))}</span><input class="input" name="stackCue" value="${esc(h.stackCue)}" maxlength="120" placeholder="${esc(t('habit.f.cuePh'))}" dir="auto"></label>
        <label class="field full"><span>${esc(t('habit.f.backup'))}</span><input class="input" name="backupPlan" value="${esc(h.backupPlan)}" maxlength="200" placeholder="${esc(t('habit.f.backupPh'))}" dir="auto"></label>
        <label class="field full"><span>${esc(t('task.f.notes'))}</span><textarea class="textarea" name="notes" rows="2" dir="auto">${esc(h.notes)}</textarea></label></form>`,
      foot: `${id ? `<button class="btn" data-act="habitArchive" data-id="${id}">${icon('archive', 'sm')}${esc(t('habit.archive'))}</button><button class="btn danger" data-act="habitDelete" data-id="${id}">${icon('trash', 'sm')}${esc(t('c.delete'))}</button><span class="grow"></span>` : ''}<button class="btn ghost" data-modal-close>${esc(t('c.cancel'))}</button><button class="btn primary" type="submit" form="habitForm">${esc(t('c.save'))}</button>`
    });
    HabitForm.sync(h.type);
    $$('#habitForm input[name=icon]').forEach(r => r.closest('.pick').setAttribute('aria-pressed', r.checked));
    $('#habitForm').addEventListener('change', e => { if (e.target.name === 'icon') $$('#habitForm input[name=icon]').forEach(r => r.closest('.pick').setAttribute('aria-pressed', r.checked)); if (e.target.name === 'color') $$('#habitForm input[name=color]').forEach(r => r.nextElementSibling.style.borderColor = r.checked ? '#fff' : 'transparent'); });
  },
  sync(type) {
    const show = (id, v) => { const el = $('#' + id); if (el) el.style.display = v ? '' : 'none'; };
    show('hfDays', type === 'days' || type === 'duration' || type === 'numeric'); show('hfTimes', type === 'times');
    show('hfTarget', type === 'duration' || type === 'numeric'); show('hfUnit', type === 'numeric');
    const l = $('#hfTarget span'); if (l) l.textContent = type === 'duration' ? t('habit.f.targetMin') : t('habit.f.target');
  }
};
CH.habitTypeChange = el => HabitForm.sync(el.value);
FORMS.habitSave = async (data, form) => {
  const o = fd(data); const id = form.dataset.id;
  if (!o.name) return fieldErr(form, 'name', t('val.required'));
  const days = [].concat(data.getAll('days')).map(Number);
  if (o.type === 'days' && !days.length) return fieldErr(form, 'days', t('habit.val.days'));
  if ((o.type === 'duration' || o.type === 'numeric') && !(+o.target > 0)) return fieldErr(form, 'target', t('val.positive'));
  const old = id ? DB.get('habits', id) : { order: Date.now() };
  await DB.put('habits', { ...old, id: id || uid(), name: o.name.slice(0, 120), desc: o.desc || '', icon: o.icon || 'star', color: o.color || '#8B5CF6', type: o.type, days, times: clamp(+o.times || 3, 1, 7), target: +o.target || 1, unit: o.unit || '', reminder: o.reminder || '', startDate: o.startDate || today(), areaId: o.areaId || '', stackAfter: o.stackAfter || '', stackCue: o.stackCue || '', backupPlan: o.backupPlan || '', notes: o.notes || '', archived: false });
  Modal.close(); toast(id ? t('c.saved') : t('habit.created'), 'ok');
};
A.newHabit = el => HabitForm.open(null, { name: el?.dataset?.name || '' });
A.editHabit = el => HabitForm.open(el.dataset.id);
A.habitToggle = async el => { const h = DB.get('habits', el.dataset.id); if (h) await Habits.toggle(h, el.dataset.d || today()); };
A.habitArchive = async el => { const h = DB.get('habits', el.dataset.id); await DB.put('habits', { ...h, archived: !h.archived }); Modal.close(); toast(h.archived ? t('habit.restored') : t('habit.archived'), 'ok'); };
A.habitDelete = async el => { if (!(await confirmDlg(t('habit.delConfirm'), { danger: true, ok: t('c.delete') }))) return; const id = el.dataset.id; await DB.delMany('habit_logs', DB.filter('habit_logs', l => l.habitId === id).map(l => l.id)); await DB.del('habits', id); Modal.close(true); };
A.habitLogValue = el => {
  const h = DB.get('habits', el.dataset.id); const ds = el.dataset.d || today(); const l = Habits.log(h, ds);
  Modal.open({ title: esc(h.name), size: 'sm', body: `<form data-form="habitValue" id="hvForm" data-id="${h.id}" data-d="${ds}" class="col"><p class="small muted">${esc(F.date(ds, 'full'))} · ${esc(t('habit.target'))}: ${esc(Habits.targetLabel(h, ds))}</p><label class="field"><span>${esc(h.type === 'duration' ? t('habit.minutesDone') : (h.unit || t('habit.value')))}</span><input class="input" type="number" min="0" step="any" name="value" value="${l?.value ?? ''}" autofocus></label><label class="field"><span>${esc(t('task.f.notes'))}</span><input class="input" name="note" value="${esc(l?.note || '')}" maxlength="200" dir="auto"></label></form>`, foot: `<button class="btn ghost" data-modal-close>${esc(t('c.cancel'))}</button><button class="btn primary" type="submit" form="hvForm">${esc(t('c.save'))}</button>` });
};
FORMS.habitValue = async (data, form) => { const h = DB.get('habits', form.dataset.id); const v = +data.get('value'); if (isNaN(v) || v < 0) return fieldErr(form, 'value', t('val.positive')); await Habits.setValue(h, form.dataset.d, v); const l = Habits.log(h, form.dataset.d); if (l) await DB.put('habit_logs', { ...l, note: (data.get('note') || '').trim() }, { quiet: true }); Modal.close(); toast(t('c.saved'), 'ok'); };
A.habitAddValue = async el => { const h = DB.get('habits', el.dataset.id); const ds = today(); const cur = +(Habits.log(h, ds)?.value || 0); await Habits.setValue(h, ds, cur + (+el.dataset.n || 1)); };
/* Habit Recovery actions */
A.recResume = async el => { const h = DB.get('habits', el.dataset.id); await DB.put('habits', { ...h, recoveryAck: el.dataset.d }); toast(t('rec.resumed'), 'ok'); };
A.recShrink = async el => { const h = DB.get('habits', el.dataset.id); const tg = Habits.measured(h) ? Math.max(1, Math.round((+h.target || 1) / 2)) : 1; await DB.put('habits', { ...h, reduced: { until: D.add(today(), 6), target: tg }, recoveryAck: el.dataset.d }); toast(t('rec.shrunk', { d: F.date(D.add(today(), 6), 'short') }), 'ok'); };
A.recReason = el => {
  const h = DB.get('habits', el.dataset.id); const d = el.dataset.d;
  Modal.open({ title: esc(t('rec.reasonTitle')), size: 'sm', body: `<form data-form="recReason" id="rrForm" data-id="${h.id}" data-d="${d}" class="col"><p class="small muted">${esc(h.name)} · ${esc(F.date(d, 'med'))}</p><div class="pick-grid">${['busy', 'tired', 'forgot', 'travel', 'sick', 'other'].map(r => `<label class="pick"><input type="radio" name="reason" value="${r}" class="sr-only" data-change="pickRadio">${esc(t('rec.r.' + r))}</label>`).join('')}</div><label class="field"><span>${esc(t('task.f.notes'))}</span><input class="input" name="note" maxlength="200" dir="auto"></label><p class="xs muted">${esc(t('rec.reasonNote'))}</p></form>`, foot: `<button class="btn primary" type="submit" form="rrForm">${esc(t('c.save'))}</button>` });
};
CH.pickRadio = el => { $$(`input[name="${el.name}"]`, el.form).forEach(r => r.closest('.pick')?.setAttribute('aria-pressed', r.checked)); };
FORMS.recReason = async (data, form) => { const h = DB.get('habits', form.dataset.id); const d = form.dataset.d; const l = Habits.log(h, d); await DB.put('habit_logs', { ...(l || { done: false, value: 0 }), id: h.id + '|' + d, habitId: h.id, date: d, reason: data.get('reason') || 'other', note: (data.get('note') || '').trim() }); await DB.put('habits', { ...h, recoveryAck: d }); Modal.close(); toast(t('rec.reasonSaved'), 'ok'); };
A.recBackup = el => { const h = DB.get('habits', el.dataset.id); Modal.open({ title: esc(t('rec.backupTitle')), size: 'sm', body: `<form data-form="recBackup" id="rbForm" data-id="${h.id}" data-d="${el.dataset.d}" class="col"><p class="small muted">${esc(t('rec.backupText'))}</p><input class="input" name="plan" value="${esc(h.backupPlan || '')}" maxlength="200" placeholder="${esc(t('habit.f.backupPh'))}" autofocus dir="auto"></form>`, foot: `<button class="btn primary" type="submit" form="rbForm">${esc(t('c.save'))}</button>` }); };
FORMS.recBackup = async (data, form) => { const h = DB.get('habits', form.dataset.id); await DB.put('habits', { ...h, backupPlan: (data.get('plan') || '').trim(), recoveryAck: form.dataset.d }); Modal.close(); toast(t('c.saved'), 'ok'); };

function weekDots(h) {
  const td = today(); return `<div class="week-dots" aria-label="${esc(t('habit.thisWeek'))}">${D.range(D.weekStart(td), 7).map(d => { const sch = Habits.scheduled(h, d); const pg = Habits.prog(h, d); const cls = !sch ? 'na' : pg >= 1 || Habits.doneOn(h, d) ? 'ok' : pg > 0 ? 'part' : d < td ? 'miss' : ''; return `<i class="${cls} ${d === td ? 'today' : ''}" title="${esc(F.date(d, 'med'))}">${esc(D.wdName(D.dow(d), 'narrow'))}</i>`; }).join('')}</div>`;
}
Views.habits = {
  render(p) {
    const tab = ['today', 'all', 'insights', 'stacks'].includes(p.tab) ? p.tab : 'today';
    const hs = Habits.list(); const td = today();
    const tabs = `<div class="tabs" role="tablist" style="margin-bottom:18px">${['today', 'all', 'insights', 'stacks'].map(k => `<button role="tab" aria-selected="${tab === k}" data-act="setParam" data-k="tab" data-v="${k}">${esc(t('habit.tab.' + k))}</button>`).join('')}</div>`;
    const head = viewHead('HABIT ENGINE', t('nav.habits'), t('habit.sub'), `<button class="btn primary" data-act="newHabit">${icon('plus', 'sm')}${esc(t('habit.new'))}</button>`);
    if (!hs.length && tab !== 'all') return head + tabs + `<section class="card">${emptyState({ title: t('habit.empty'), text: t('habit.emptyText'), action: `<div class="row wrap" style="justify-content:center">${['read', 'walk', 'water', 'meditate'].map(k => `<button class="btn sm" data-act="newHabit" data-name="${esc(t('habit.ex.' + k))}">${esc(t('habit.ex.' + k))}</button>`).join('')}<button class="btn primary sm" data-act="newHabit">${icon('plus', 'sm')}${esc(t('habit.new'))}</button></div>` })}</section>`;
    const recovery = hs.map(h => ({ h, d: Habits.missed(h) })).filter(x => x.d);
    const recHTML = recovery.length && tab === 'today' ? recovery.map(({ h, d }) => `<section class="card recovery" style="margin-bottom:14px"><div class="card-h">${icon('leaf')}<h3>Habit Recovery · <span class="ucontent">${esc(h.name)}</span><div class="card-sub">${esc(Habits.weekly(h) ? t('rec.textWeek') : t('rec.text', { d: F.date(d, 'med') }))}</div></h3></div>
      <div class="row wrap"><button class="btn sm" data-act="recResume" data-id="${h.id}" data-d="${d}">${icon('play', 'sm')}${esc(t('rec.resume'))}</button><button class="btn sm" data-act="recShrink" data-id="${h.id}" data-d="${d}">${icon('arrow-down', 'sm')}${esc(t('rec.shrink'))}</button><button class="btn sm" data-act="recReason" data-id="${h.id}" data-d="${d}">${icon('edit', 'sm')}${esc(t('rec.reason'))}</button><button class="btn sm" data-act="recBackup" data-id="${h.id}" data-d="${d}">${icon('layers', 'sm')}${esc(t('rec.backup'))}</button></div>
      ${h.backupPlan ? `<p class="small" style="margin-top:8px"><span class="muted">${esc(t('rec.yourBackup'))}:</span> <span class="ucontent">${esc(h.backupPlan)}</span></p>` : ''}</section>`).join('') : '';
    if (tab === 'today' || tab === 'all') {
      const list = tab === 'today' ? hs.filter(h => Habits.scheduled(h, td)) : [...hs, ...DB.filter('habits', h => h.archived)];
      return head + tabs + recHTML + `<div class="col" style="gap:12px">${list.map(h => this.card(h, td)).join('') || emptyState({ title: t('habit.noneToday'), small: true })}</div>`;
    }
    if (tab === 'insights') return head + tabs + this.insights(hs);
    return head + tabs + this.stacks(hs);
  },
  card(h, td) {
    const st = Habits.stats(h); const ok = Habits.okOn(h, td); const meas = Habits.measured(h); const val = +(Habits.log(h, td)?.value || 0); const red = Habits.isReduced(h);
    const stack = h.stackAfter ? DB.get('habits', h.stackAfter) : null;
    return `<article class="habit" style="${h.archived ? 'opacity:.6' : ''}">
      <span class="habit-ic" style="background:linear-gradient(135deg,${esc(h.color || '#8B5CF6')},${esc(h.color || '#8B5CF6')}99)">${icon(h.icon || 'star', 'lg')}</span>
      <div class="col" style="gap:6px;min-width:0">

const IntegrityDlg = {
  open(sess, cycle) {

    const root = Modal.open({
      title: esc(cycle != null ? t('integ.doneTitle', { m: F.dur(sess.minutes) }) : t('integ.rate')), size: 'sm',
      body: `<div class="col"><p class="small muted">${esc(t('integ.q'))}</p><div class="pick-grid" style="grid-template-columns:1fr">${['calm', 'some', 'many'].map(k => `<button class="pick" data-integ="${k}" aria-pressed="${sess.integrity === k}">${icon({ calm: 'leaf', some: 'activity', many: 'alert' }[k])}${esc(t('integ.' + k))}</button>`).join('')}</div>
        <label class="field"><span>${esc(t('integ.note'))}</span><input class="input" id="integNote" value="${esc(sess.note || '')}" maxlength="200" dir="auto"></label>
        <p class="xs muted">${esc(t('integ.privacy'))}</p></div>`,
      foot: cycle != null ? `<button class="btn ghost" data-integ-save="none">${esc(t('integ.skipBreak'))}</button><button class="btn" data-integ-save="${longNext ? 'short' : 'long'}">${esc(t(longNext ? 'integ.shortBreak' : 'integ.longBreak'))}</button><button class="btn primary" data-integ-save="${longNext ? 'long' : 'short'}">${esc(t(longNext ? 'integ.longBreak' : 'integ.shortBreak'))}</button>` : `<button class="btn primary" data-integ-save="none">${esc(t('c.save'))}</button>`
    });
    let choice = sess.integrity;
    root.querySelectorAll('[data-integ]').forEach(b => b.onclick = () => { choice = b.dataset.integ; root.querySelectorAll('[data-integ]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    root.querySelectorAll('[data-integ-save]').forEach(b => b.onclick = async () => {
      try { await DB.put('focus_sessions', { ...DB.get('focus_sessions', sess.id), integrity: choice || null, note: ($('#integNote')?.value || '').trim().slice(0, 200) }); } catch { return; }
      Modal.close(); const br = b.dataset.integSave; if (br !== 'none') await Timer.start({ mode: br });
      if (cycle != null) toast(t('focus.sessionSaved'), 'ok');
    });
  }
};

const FocusMode = {

  open() {
    if (!Timer.st) return; this.close();

    const el = document.createElement('div'); el.className = 'focus-mode'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', t('focus.modeBtn'));
    el.innerHTML = `<span class="eyebrow" style="color:#C4B5FD">${esc(t('focus.mode.' + st.mode))}</span>
      ${tk ? `<div class="fm-task ucontent">${esc(tk.title)}</div>` : ''}${st.intention ? `<div class="fm-int ucontent">${esc(st.intention)}</div>` : ''}

      <div class="fm-actions"><button class="btn lg" data-fm="toggle">${st.running ? icon('pause') + esc(t('focus.pause')) : icon('play') + esc(t('focus.resume'))}</button><button class="btn lg success" data-fm="finish">${icon('check')}${esc(t('focus.finish'))}</button><button class="btn lg" data-fm="end">${icon('stop')}${esc(t('focus.end'))}</button><button class="btn lg ghost" data-fm="exit">${icon('x')}${esc(t('focus.exitMode'))}</button></div>

    el.addEventListener('click', async e => { const b = e.target.closest('[data-fm]'); if (!b) return; const a = b.dataset.fm; if (a === 'toggle') { Timer.st?.running ? await Timer.pause() : await Timer.resume(); this.open(); } else if (a === 'finish') await Timer.complete(false); else if (a === 'end') { this.close(); await Timer.end(); } else this.close(); });
    document.body.appendChild(el); this.el = el; el.querySelector('[data-fm="toggle"]').focus();
  },
  close() { if (this.el) { this.el.remove(); this.el = null; } }

FORMS.goalSave = async (data, form) => {
  const o = fd(data); const id = form.dataset.id;
  if (!o.title) return fieldErr(form, 'title', t('val.required'));
  if (o.startDate && o.targetDate && o.targetDate < o.startDate) return fieldErr(form, 'targetDate', t('val.dateAfter'));
  if (o.target !== '' && +o.target === +(o.baseline || 0)) return fieldErr(form, 'target', t('goal.val.target'));
  let p = o.parentId, guard = 0; while (p && guard++ < 50) { if (p === id) return fieldErr(form, 'parentId', t('goal.val.loop')); p = DB.get('goals', p)?.parentId; }
  const old = id ? DB.get('goals', id) : { steps: [] };
  const rec = await DB.put('goals', { ...old, id: id || uid(), title: o.title.slice(0, 200), level: o.level, parentId: o.parentId || '', areaId: o.areaId || '', status: o.status, outcome: o.outcome || '', why: o.why || '', startDate: o.startDate || '', targetDate: o.targetDate || '', metric: o.metric || '', baseline: o.baseline === '' ? '' : +o.baseline, current: o.current === '' ? '' : +o.current, target: o.target === '' ? '' : +o.target, achievedAt: o.status === 'achieved' ? (old.achievedAt || nowISO()) : null });
  Modal.close(); toast(id ? t('c.saved') : t('goal.created'), 'ok');
  if (o.status === 'achieved' && old.status !== 'achieved') { await Points.award('goal:' + rec.id, 30, 'pts.goal'); FX.big(t('goal.achievedToast', { name: rec.title })); }
  else await Goals.checkAchieved(rec.id);
};

FORMS.journalSave = async (data, form) => {
  const o = fd(data); const id = form.dataset.id;
  if (!D.valid(o.date)) return fieldErr(form, 'date', t('val.date'));
  let qs = []; try { qs = JSON.parse(o.qs || '[]'); } catch { }
  const answers = {}; qs.forEach((q, i) => { const v = o['q' + i]; if (v) answers[q] = v; });
  if (!o.body && !Object.keys(answers).length && !o.mood && !o.energy) return fieldErr(form, 'body', t('j.val.empty'));
  const old = id ? DB.get('journal_entries', id) : {};
  const rec = await DB.put('journal_entries', { ...old, id: id || uid(), date: o.date, type: o.type, title: o.title || old.title || '', questions: qs, answers, body: o.body || '', mood: o.mood ? +o.mood : null, energy: o.energy ? +o.energy : null, focus: o.focus ? +o.focus : null, projectId: o.projectId || '', tags: uniq((o.tags || '').split(/[,،]/).map(s => s.trim()).filter(Boolean)).slice(0, 10) });
  if (rec.energy) { const exists = DB.find('energy_logs', e => e.journalId === rec.id); const l = D.isoLocal(nowISO()); await DB.put('energy_logs', { ...(exists || {}), id: exists?.id || uid(), journalId: rec.id, at: exists?.at || nowISO(), date: rec.date, hour: exists?.hour ?? l.h, level: rec.energy }, { quiet: true }); }
  if (o.type === 'evening') await Points.award('review:' + o.date, 10, 'pts.review');
  if (o.projectId) Projects.touch(o.projectId);
  Modal.close(); toast(t('j.saved'), 'ok');
  if (S.route.params.new) { const p = { ...S.route.params }; delete p.new; delete p.date; go('journal', p); }
};

      ${lessons.length ? `<section class="card accent" style="margin-top:18px"><div class="card-h">${icon('bulb')}<h2>${esc(t('dec.lessons'))}</h2></div><div class="list">${lessons.map(d => `<div class="item"><span class="grow small"><b class="ucontent">${esc(d.title)}</b> — <span class="ucontent">${esc(d.lessons)}</span></span></div>`).join('')}</div></section>` : ''}`;
  },
  manual() {
    const m = DB.get('kv', 'manual') || {};
    const secs = ['times', 'habits', 'distractions', 'goals', 'rules', 'organize'];
    const hint = { times: () => { const em = DB.all('energy_logs'); if (em.length < 5) return ''; const byH = groupBy(em, e => e.hour); const best = sortBy([...byH].filter(([, v]) => v.length >= 2), (a, b) => avg(b[1].map(e => e.level)) - avg(a[1].map(e => e.level)))[0]; return best ? t('man.hintEnergy', { h: F.minTime(best[0] * 60) }) : ''; }, distractions: () => { const d = groupBy(DB.all('distraction_logs'), x => x.cause); const top = sortBy([...d], (a, b) => b[1].length - a[1].length)[0]; return top ? t('man.hintDist', { c: t('dist.' + top[0]) }) : ''; }, goals: () => Goals.active().slice(0, 3).map(g => g.title).join(' · ') };
    return `<form data-form="manualSave" class="col"><p class="small muted">${esc(t('man.sub'))}</p><div class="grid g2">${secs.map(k => { const h = hint[k]?.(); return `<section class="card tight"><label class="field"><span style="font-size:.95rem;color:var(--text)">${esc(t('man.' + k))}</span><textarea class="textarea" name="${k}" rows="5" dir="auto" placeholder="${esc(t('man.' + k + 'Ph'))}">${esc(m[k] || '')}</textarea>${h ? `<span class="hint">${icon('info', 'sm')} ${esc(t('man.fromData'))}: ${esc(h)}</span>` : ''}</label></section>`; }).join('')}</div>
      <div class="row"><button class="btn primary" type="submit">${esc(t('c.save'))}</button><button class="btn" type="button" data-act="manualPrint">${icon('printer', 'sm')}${esc(t('c.print'))}</button>${m.updatedAt ? `<span class="xs muted">${esc(t('c.lastSaved'))}: ${esc(F.dt(m.updatedAt))}</span>` : ''}</div></form>`;
  }
};

FORMS.manualSave = async data => { const o = {}; for (const [k, v] of data.entries()) o[k] = String(v).slice(0, 5000); await DB.put('kv', { ...(DB.get('kv', 'manual') || {}), ...o, id: 'manual' }); toast(t('c.saved'), 'ok'); };
A.manualPrint = () => { const m = DB.get('kv', 'manual') || {}; printDoc('Personal Operating Manual', ['times', 'habits', 'distractions', 'goals', 'rules', 'organize'].map(k => `<h2>${esc(t('man.' + k))}</h2><p style="white-space:pre-wrap">${esc(m[k] || '—')}</p>`).join('')); };
const DecisionForm = {
  open(id = null, review = false) {
    const d = id ? DB.get('decisions', id) : { title: '', options: '', reason: '', expected: '', reviewDate: D.addMonths(today(), 1), outcome: '', lessons: '' };

        ${review ? `<p class="ucontent"><b>${esc(d.title)}</b></p><p class="small muted ucontent">${esc(t('dec.f.expected'))}: ${esc(d.expected || '—')}</p>
          <label class="field"><span>${esc(t('dec.f.outcome'))}</span><textarea class="textarea" name="outcome" rows="3" dir="auto" autofocus>${esc(d.outcome)}</textarea></label><label class="field"><span>${esc(t('dec.f.lessons'))}</span><textarea class="textarea" name="lessons" rows="3" dir="auto">${esc(d.lessons)}</textarea></label>`
        : `<label class="field"><span>${esc(t('dec.f.title'))} *</span><input class="input" name="title" value="${esc(d.title)}" maxlength="200" required autofocus dir="auto"></label>
          <label class="field"><span>${esc(t('dec.f.options'))}</span><textarea class="textarea" name="options" rows="2" dir="auto">${esc(d.options)}</textarea></label>
          <label class="field"><span>${esc(t('dec.f.reason'))}</span><textarea class="textarea" name="reason" rows="2" dir="auto">${esc(d.reason)}</textarea></label>
          <label class="field"><span>${esc(t('dec.f.expected'))}</span><textarea class="textarea" name="expected" rows="2" dir="auto">${esc(d.expected)}</textarea></label>
          <label class="field"><span>${esc(t('dec.f.reviewDate'))}</span><input class="input" type="date" name="reviewDate" value="${esc(d.reviewDate)}"></label>`}</form>`,
      foot: `<button class="btn ghost" data-modal-close>${esc(t('c.cancel'))}</button><button class="btn primary" type="submit" form="decForm">${esc(t('c.save'))}</button>`
    });

};
FORMS.decisionSave = async (data, form) => {
  const o = fd(data); const id = form.dataset.id; const old = id ? DB.get('decisions', id) : {};
  if (form.dataset.review) { if (!o.outcome) return fieldErr(form, 'outcome', t('val.required')); await DB.put('decisions', { ...old, outcome: o.outcome, lessons: o.lessons || '', reviewed: true, reviewedAt: nowISO() }); }
  else { if (!o.title) return fieldErr(form, 'title', t('val.required')); await DB.put('decisions', { ...old, id: id || uid(), title: o.title.slice(0, 200), options: o.options || '', reason: o.reason || '', expected: o.expected || '', reviewDate: o.reviewDate || '' }); }
  Modal.close(); toast(t('c.saved'), 'ok');
};
A.decisionNew = () => DecisionForm.open();

/* Printable document helper (uses a hidden iframe; works offline) */
function printDoc(title, html) {
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;width:0;height:0;border:0;opacity:0'; document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(`<!DOCTYPE html><html lang="${S.lang}" dir="${isRTL() ? 'rtl' : 'ltr'}"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;color:#111;padding:32px;line-height:1.6}h1{color:#5B3FD6}h2{font-size:1.05rem;margin-top:22px;border-bottom:1px solid #ddd;padding-bottom:4px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:6px;text-align:start}</style></head><body><h1>${esc(title)}</h1>${html}<p style="color:#888;font-size:12px;margin-top:30px">ORION — ${esc(F.date(today(), 'full'))}</p></body></html>`); d.close();
  setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast(t('err.print'), 'err'); } setTimeout(() => f.remove(), 2000); }, 250);
}
</script>

<script>
'use strict';
/* =====================================================================
   VIEWS (C1): ANALYTICS · ENERGY MAP · LIFE BALANCE · LEARNING · QUESTS
   ===================================================================== */

/* ---------- ORION ANALYTICS ---------- */
const An = {
  range(n) { const td = today(); return { a: D.add(td, -(n - 1)), b: td, days: D.range(D.add(td, -(n - 1)), n) }; },
  metrics(a, b) {
    const days = D.between(a, b);
    const done = Tasks.all().filter(x => x.status === 'done' && x.completedAt && (d => d >= a && d <= b)(D.isoLocal(x.completedAt).date));
    const due = Tasks.all().filter(x => !x.deletedAt && x.due >= a && x.due <= b && x.status !== 'cancelled');
    const rate = due.length ? due.filter(x => x.status === 'done').length / due.length : null;
    const focus = Focus.minutesRange(a, b);
    const hs = Habits.list(); const hDays = days.map(d => { const c = hs.filter(h => Habits.countsOn(h, d)); return c.length ? c.filter(h => Habits.okOn(h, d)).length / c.length : null; }).filter(v => v != null);
    const journal = DB.filter('journal_entries', j => j.date >= a && j.date <= b).length;
    const scores = days.map(d => Score.day(d)).filter(s => s.hasData && s.total != null).map(s => s.total);
    return { done: done.length, doneList: done, rate, focus, habits: hDays.length ? avg(hDays) : null, journal, score: scores.length ? Math.round(avg(scores)) : null, scoreDays: scores.length };
  },
  delta(cur, prev, pct = false, fmt = null) {
    if (cur == null || prev == null) return '';
    const d = cur - prev; if (Math.abs(d) < (pct ? 0.005 : 0.5)) return `<span class="chip xs">${esc(t('an.same'))}</span>`;
    return `<span class="chip ${d > 0 ? 'g' : 'w'}">${icon(d > 0 ? 'arrow-up' : 'arrow-down', 'sm')}${pct ? F.pct(Math.abs(d)) : fmt ? esc(fmt(Math.abs(Math.round(d)))) : F.num(Math.abs(Math.round(d)))}</span>`;
  },
  heat(rows, cols, val, fmt, max) {
    const mx = max || Math.max(1, ...rows.flatMap(r => cols.map(c => val(r, c) || 0)));
    return `<div class="scroll-x"><div style="display:grid;grid-template-columns:auto repeat(${cols.length},minmax(34px,1fr));gap:4px;min-width:${80 + cols.length * 38}px" role="table" aria-label="${esc(t('an.heat'))}">
      <span></span>${cols.map(c => `<span class="xs muted" style="text-align:center" role="columnheader">${esc(c.l)}</span>`).join('')}
      ${rows.map(r => `<span class="xs muted" style="align-self:center;padding-inline-end:6px" role="rowheader">${esc(r.l)}</span>${cols.map(c => { const v = val(r, c); return `<span role="cell" data-tip="${esc(r.l + ' · ' + c.l + ' · ' + (v == null ? t('an.noData') : fmt(v)))}" style="height:30px;border-radius:7px;background:${v == null ? 'var(--surface-2)' : `rgba(139,92,246,${(.15 + .75 * clamp(v / mx, 0, 1)).toFixed(2)})`};border:1px solid var(--line)"></span>`; }).join('')}`).join('')}</div></div>`;
  }
};
const BANDS = [[5, 9], [9, 12], [12, 15], [15, 18], [18, 21], [21, 24]];
Views.analytics = {
  render(p) {
    const tabs = ['overview', 'tasks', 'habits', 'focus', 'goals', 'energy', 'distractions'];
    const tab = tabs.includes(p.tab) ? p.tab : 'overview'; const n = [7, 30, 90].includes(+p.r) ? +p.r : 30;
    const R = An.range(n); const P = { a: D.add(R.a, -n), b: D.add(R.a, -1) };
    const head = viewHead('ORION ANALYTICS', t('nav.analytics'), t('an.sub'), `<div class="tabs" role="tablist" aria-label="${esc(t('an.range'))}">${[7, 30, 90].map(k => `<button role="tab" aria-selected="${n === k}" data-act="setParam" data-k="r" data-v="${k}">${esc(t('an.days', { n: k }))}</button>`).join('')}</div><button class="btn" data-act="anReport" data-n="${n}">${icon('printer', 'sm')}${esc(t('an.report'))}</button>`);
    const tabsH = `<div class="tabs" role="tablist" style="margin-bottom:18px;overflow-x:auto;max-width:100%">${tabs.map(k => `<button role="tab" aria-selected="${tab === k}" data-act="setParam" data-k="tab" data-v="${k}">${k === 'energy' ? 'Energy Map' : esc(t('an.tab.' + k))}</button>`).join('')}</div>`;
    const anyData = Tasks.all().length || Focus.sessions().length || Habits.list().length || DB.all('journal_entries').length || DB.all('energy_logs').length || DB.all('distraction_logs').length;
    if (!anyData) return head + `<section class="card">${emptyState({ title: t('an.empty'), text: t('an.emptyText'), action: `<button class="btn primary" data-act="go" data-to="home">${esc(t('an.startUsing'))}</button>` })}</section>`;
    return head + tabsH + (this[tab](R, P, n) || '');
  },
  overview(R, P, n) {
    const m = An.metrics(R.a, R.b), pm = An.metrics(P.a, P.b);
    const kpi = (ic, cls, v, l, d) => `<div class="kpi"><div class="k-ic ${cls}">${icon(ic)}</div><div class="stat grow"><b class="num">${v}</b><span>${esc(l)}</span></div>${d}</div>`;
    const scoreDays = R.days.map(d => ({ d, s: Score.day(d) })).filter(x => x.s.hasData && x.s.total != null);
    const byHour = Array(24).fill(0); Focus.sessions().filter(s => s.date >= R.a).forEach(s => byHour[s.hour ?? 0] += s.minutes);
    const wd = [0, 1, 2, 3, 4, 5, 6].map(i => { const ds = R.days.filter(d => D.dow(d) === i); return ds.length ? sum(ds.map(d => Tasks.completedOn(d).length)) / ds.length : 0; });
    return `<div class="grid g3" style="margin-bottom:20px">${kpi('check', 'v', F.num(m.done), t('an.tasksDone'), An.delta(m.done, pm.done))}${kpi('list', 'b', m.rate == null ? '—' : F.pct(m.rate), t('an.completion'), An.delta(m.rate, pm.rate, true))}${kpi('target', 'p', esc(F.dur(m.focus)), t('an.focusTime'), An.delta(m.focus, pm.focus, false, v => F.dur(v)))}${kpi('repeat', 'g', m.habits == null ? '—' : F.pct(m.habits), t('an.habitCons'), An.delta(m.habits, pm.habits, true))}${kpi('journal', 'v', F.num(m.journal), t('an.journal'), An.delta(m.journal, pm.journal))}${kpi('sparkles', 'b', m.score == null ? '—' : F.num(m.score), t('an.avgScore', { n: m.scoreDays }), An.delta(m.score, pm.score))}</div>
      <p class="xs muted" style="margin:-8px 0 18px">${esc(t('an.vsPrev', { n }))}</p>
      <div class="grid g2"><section class="card"><div class="card-h">${icon('sparkles')}<h2>ORION Daily Score<div class="card-sub">${esc(t('an.scoreSub'))}</div></h2></div>${scoreDays.length ? Chart.bars({ data: scoreDays.slice(-31).map(x => ({ l: F.date(x.d, 'med'), s: F.date(x.d, n > 7 ? 'dnum' : 'wd'), v: x.s.total })), max: 100, labelEvery: scoreDays.length > 14 ? 3 : 1, aria: 'Daily Score' }) : `<p class="small muted">${esc(t('an.noScore'))}</p>`}</section>
        <section class="card"><div class="card-h">${icon('clock')}<h2>${esc(t('an.prodHours'))}<div class="card-sub">${esc(t('an.prodHoursSub'))}</div></h2></div>${sum(byHour) ? Chart.bars({ data: byHour.map((v, h) => ({ l: F.minTime(h * 60), s: h % 3 === 0 ? String(h) : '', v: Math.round(v) })), fmt: v => F.dur(v), color: 'url(#gBlue)', aria: t('an.prodHours') }) : `<p class="small muted">${esc(t('an.noFocus'))}</p>`}</section>
        <section class="card"><div class="card-h">${icon('calendar')}<h2>${esc(t('an.weekday'))}<div class="card-sub">${esc(t('an.weekdaySub'))}</div></h2></div>${sum(wd) ? Chart.bars({ data: D.weekdays().map(w => ({ l: D.wdName(w, 'long'), s: D.wdName(w), v: Math.round(wd[w] * 10) / 10 })), fmt: v => F.num(v, 1), color: 'url(#gPink)', aria: t('an.weekday') }) : `<p class="small muted">${esc(t('an.noTasksDone'))}</p>`}</section>
        <section class="card"><div class="card-h">${icon('bulb')}<h2>${esc(t('an.insights'))}</h2></div>${this.insights(R, m, pm)}</section></div>`;
  },
  insights(R, m, pm) {
    const out = [];
    const byHour = Array(24).fill(0); Focus.sessions().filter(s => s.date >= R.a).forEach(s => byHour[s.hour ?? 0] += s.minutes);
    if (sum(byHour) >= 60) { const h = byHour.indexOf(Math.max(...byHour)); out.push(t('an.ins.peak', { h: F.minTime(h * 60) })); }
    if (m.focus && pm.focus) out.push(t(m.focus >= pm.focus ? 'an.ins.focusUp' : 'an.ins.focusDown', { a: F.dur(m.focus), b: F.dur(pm.focus) }));
    const est = m.doneList.filter(x => +x.estimate > 0 && +x.actual > 0); if (est.length >= 3) { const r = sum(est.map(x => +x.actual)) / sum(est.map(x => +x.estimate)); out.push(t(r > 1.15 ? 'an.ins.under' : r < .85 ? 'an.ins.over' : 'an.ins.accurate', { p: F.pct(Math.abs(r - 1)) })); }
    const pp = DB.filter('tasks', x => x.status === 'postponed').length; if (pp >= 3) out.push(t('an.ins.postponed', { n: pp }));
    const d = groupBy(DB.filter('distraction_logs', x => x.date >= R.a), x => x.cause); const top = sortBy([...d], (a, b) => b[1].length - a[1].length)[0]; if (top && top[1].length >= 3) out.push(t('an.ins.dist', { c: t('dist.' + top[0]), n: top[1].length }));
    return out.length ? `<ul class="reason-list">${out.map(s => `<li>${icon('info', 'sm')}<span>${esc(s)}</span></li>`).join('')}</ul><p class="xs muted" style="margin-top:10px">${esc(t('an.insNote'))}</p>` : `<p class="small muted">${esc(t('an.insNone'))}</p>`;
  },
  tasks(R) {
    const done = An.metrics(R.a, R.b).doneList; const td = today();
    const byPrio = PRIOS.map(pr => ({ l: t('prio.' + pr), v: done.filter(x => x.priority === pr).length, c: { p1: 'var(--pink)', p2: 'var(--violet)', p3: 'var(--blue)', p4: 'var(--text-3)' }[pr] }));
    const byProj = [...groupBy(done, x => x.projectId || '_')].map(([k, v]) => ({ l: k === '_' ? t('task.noProj') : DB.get('projects', k)?.name || t('task.noProj'), v: v.length })).sort((a, b) => b.v - a.v).slice(0, 8);
    const est = done.filter(x => +x.estimate > 0 && +x.actual > 0);
    const od = Tasks.live().filter(Tasks.overdue).length; const pp = Tasks.live().filter(x => x.status === 'postponed').length;
    return `<div class="grid g3" style="margin-bottom:20px"><div class="kpi"><div class="k-ic v">${icon('check')}</div><div class="stat"><b class="num">${F.num(done.length)}</b><span>${esc(t('an.tasksDone'))}</span></div></div><div class="kpi"><div class="k-ic p">${icon('alert')}</div><div class="stat"><b class="num">${F.num(od)}</b><span>${esc(t('an.overdueNow'))}</span></div></div><div class="kpi"><div class="k-ic b">${icon('clock')}</div><div class="stat"><b class="num">${F.num(pp)}</b><span>${esc(t('status.postponed'))}</span></div></div></div>
      <div class="grid g2"><section class="card"><div class="card-h"><h3>${esc(t('an.donePerDay'))}</h3></div>${Chart.bars({ data: R.days.map(d => ({ l: F.date(d, 'med'), s: F.date(d, R.days.length > 7 ? 'dnum' : 'wd'), v: Tasks.completedOn(d).length })), labelEvery: R.days.length > 31 ? 7 : R.days.length > 14 ? 3 : 1, aria: t('an.donePerDay') })}</section>
        <section class="card"><div class="card-h"><h3>${esc(t('an.byPrio'))}</h3></div>${sum(byPrio.map(x => x.v)) ? Chart.hbars(byPrio) : `<p class="small muted">—</p>`}<div class="divider"></div><div class="card-h"><h3>${esc(t('an.byProject'))}</h3></div>${byProj.length ? Chart.hbars(byProj) : `<p class="small muted">—</p>`}</section>
        <section class="card" style="grid-column:1/-1"><div class="card-h"><h3>${esc(t('an.estAcc'))}<div class="card-sub">${esc(t('an.estAccSub'))}</div></h3></div>${est.length ? `<div class="scroll-x"><table class="table"><thead><tr><th>${esc(t('task.f.title'))}</th><th>${esc(t('task.f.estimate'))}</th><th>${esc(t('task.f.actual'))}</th><th>Δ</th></tr></thead><tbody>${sortBy(est, (a, b) => Math.abs(b.actual - b.estimate) - Math.abs(a.actual - a.estimate)).slice(0, 10).map(x => `<tr><td class="ucontent">${esc(x.title)}</td><td class="num">${esc(F.dur(x.estimate))}</td><td class="num">${esc(F.dur(x.actual))}</td><td><span class="chip ${x.actual > x.estimate * 1.15 ? 'w' : 'g'}">${x.actual > x.estimate ? '+' : '−'}${esc(F.dur(Math.abs(x.actual - x.estimate)))}</span></td></tr>`).join('')}</tbody></table></div>` : `<p class="small muted">${esc(t('an.estNone'))}</p>`}</section></div>`;
  },
  habits(R) {
    const hs = Habits.list(); if (!hs.length) return `<section class="card">${emptyState({ title: t('habit.empty'), action: `<button class="btn primary" data-act="newHabit">${esc(t('habit.new'))}</button>`, small: true })}</section>`;
    const items = hs.map(h => { const ds = R.days.filter(d => Habits.scheduled(h, d) && (d !== today() || Habits.doneOn(h, d))); const r = Habits.weekly(h) ? Habits.stats(h).w30 : (ds.length ? ds.filter(d => Habits.doneOn(h, d)).length / ds.length : null); return { l: h.name, v: r == null ? 0 : Math.round(r * 100), c: h.color }; });
    const daily = R.days.map(d => { const c = hs.filter(h => Habits.countsOn(h, d)); return { l: F.date(d, 'med'), s: F.date(d, R.days.length > 7 ? 'dnum' : 'wd'), v: c.length ? Math.round(c.filter(h => Habits.okOn(h, d)).length / c.length * 100) : 0 }; });
    return `<div class="grid g2"><section class="card"><div class="card-h"><h3>${esc(t('an.habitPer'))}</h3></div>${Chart.hbars(items, { fmt: v => F.num(v) + '%' })}</section><section class="card"><div class="card-h"><h3>${esc(t('an.habitDaily'))}</h3></div>${Chart.bars({ data: daily, max: 100, fmt: v => F.num(v) + '%', labelEvery: R.days.length > 31 ? 7 : R.days.length > 14 ? 3 : 1, color: 'url(#gGreen)', aria: t('an.habitDaily') })}<a class="small" href="#/habits?tab=insights">${esc(t('an.moreHabit'))}</a></section></div>`;
  },
  focus(R) {
    const ss = Focus.sessions().filter(s => s.date >= R.a); if (!ss.length) return `<section class="card">${emptyState({ title: t('an.noFocus'), action: `<button class="btn primary" data-act="go" data-to="focus">${esc(t('focus.startBtn'))}</button>`, small: true })}</section>`;

      <section class="card"><div class="card-h">${icon('medal')}<h2>${esc(t('ach.unlockedN', { a: unlocked, b: ACH.length }))}</h2></div>${bar(unlocked / ACH.length, 'p')}<p class="small muted" style="margin-top:10px">${esc(t('ach.rules'))}</p></section>
      <section class="card"><div class="card-h">${icon('info')}<h2>${esc(t('ach.howTitle'))}</h2></div><ul class="reason-list">${['habit', 'task', 'focus', 'review', 'goal'].map(k => `<li>${icon('check', 'sm')}<span>${esc(t('ach.how.' + k))}</span></li>`).join('')}</ul></section></div>
